<svg xmlns="http://www.w3.org/2000/svg" width="96" height="100" viewBox="0 0 96 100">
  <g transform="translate(0, -2)">
    <!-- Ground Shadow -->
    <ellipse cx="48" cy="96" rx="22" ry="3.2" fill="#004B71" opacity="0.18"/>
    <!-- Twin TechMedha 'M' Antennae (Left = Blue, Right = Red) -->
    <path d="M 41 18 L 35 10" stroke="#004B71" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="34.5" cy="8.5" r="3.8" fill="#004B71" stroke="#FFFFFF" stroke-width="1.2"/>
    <path d="M 55 18 L 55 8.5" stroke="#D31B22" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="55" cy="7" r="3.8" fill="#D31B22" stroke="#FFFFFF" stroke-width="1.2"/>
    <!-- Back Arm -->
    <path d="M 34 50 L 22 58 L 26 64 L 37 56 Z" fill="#FFFFFF" stroke="#004B71" stroke-width="2.4" stroke-linejoin="round"/>
           <circle cx="23.5" cy="61" r="3.8" fill="#D31B22" stroke="#004B71" stroke-width="2"/>
    <!-- Legs & Boots -->
    <path d="M 40 72 L 30 87 L 38 90 L 46 74 Z" fill="#004B71" stroke="#004B71" stroke-width="2" stroke-linejoin="round"/>
           <rect x="28" y="85" width="12" height="5.5" rx="2.8" transform="rotate(14 34 87)" fill="#D31B22" stroke="#004B71" stroke-width="2"/>
           <path d="M 50 72 L 60 87 L 68 83 L 57 71 Z" fill="#004B71" stroke="#004B71" stroke-width="2" stroke-linejoin="round"/>
           <rect x="58" y="82" width="12" height="5.5" rx="2.8" transform="rotate(-16 64 85)" fill="#D31B22" stroke="#004B71" stroke-width="2"/>
    <!-- Robot Torso Chassis -->
    <rect x="33" y="46" width="30" height="29" rx="10" fill="#FFFFFF" stroke="#004B71" stroke-width="2.6"/>
    <path d="M 36 47 L 48 52 L 60 47" fill="none" stroke="#D31B22" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="37.5" y="51" width="21" height="19.5" rx="5" fill="#F8FAFC" stroke="#004B71" stroke-width="1.6"/>
    <!-- TechMedha 'M' Emblem on Chest -->
    
      <g transform="translate(48, 60) scale(0.95)">
        <!-- Left Figure (Deep Teal Blue) -->
        <circle cx="-4.2" cy="-5.2" r="1.9" fill="#004B71" />
        <path d="M -5.8 -2.5 L 0 4.5 L -2.8 2.5 L -2.8 7.2 A 1.5 1.5 0 0 1 -5.8 7.2 Z" fill="#004B71" />
        <!-- Right Figure (Crimson Red) -->
        <circle cx="4.2" cy="-5.2" r="1.9" fill="#D31B22" />
        <path d="M 5.8 -2.5 L 0 4.5 L 2.8 2.5 L 2.8 7.2 A 1.5 1.5 0 0 0 5.8 7.2 Z" fill="#D31B22" />
        <text x="0" y="11.8" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="3.6" fill="#D31B22">Tech<tspan fill="#004B71">Medha</tspan></text>
      </g>
    <!-- Front Arm -->
    <path d="M 60 50 L 73 43 L 76 49 L 62 57 Z" fill="#FFFFFF" stroke="#004B71" stroke-width="2.4" stroke-linejoin="round"/>
           <circle cx="75" cy="46" r="3.8" fill="#D31B22" stroke="#004B71" stroke-width="2"/>
    <!-- Head / Helmet -->
    <rect x="26" y="16" width="44" height="30" rx="14" fill="#FFFFFF" stroke="#004B71" stroke-width="2.6"/>
    <!-- Ear Pods -->
    <rect x="22" y="25" width="5" height="12" rx="2.5" fill="#004B71" stroke="#004B71" stroke-width="1.8"/>
    <rect x="69" y="25" width="5" height="12" rx="2.5" fill="#D31B22" stroke="#004B71" stroke-width="1.8"/>
    <!-- Forehead Crest -->
    <path d="M 43 16.5 L 48 21 L 53 16.5 Z" fill="#D31B22"/>
    <!-- Digital Visor -->
    <rect x="32" y="21.5" width="34" height="20" rx="8.5" fill="#004B71"/>
    <!-- Visor Eyes & Smile -->
    <path d="M 39.5 31 L 42.5 28 L 45.5 31" fill="none" stroke="#38BDF8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
           <circle cx="56.5" cy="30" r="4" fill="#38BDF8"/>
           <circle cx="57.8" cy="28.7" r="1.4" fill="#FFFFFF"/>
           <path d="M 45 35.5 Q 49.5 40.5 54 35.5 Z" fill="#38BDF8"/>
  </g>
</svg>