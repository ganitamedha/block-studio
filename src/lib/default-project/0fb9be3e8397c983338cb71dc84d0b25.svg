<svg xmlns="http://www.w3.org/2000/svg" width="96" height="100" viewBox="0 0 96 100">
  <g transform="translate(0, -3)">
    <!-- Shadow -->
    <ellipse cx="48" cy="97" rx="19" ry="3" fill="#000000" opacity="0.18"/>
    <!-- Antenna -->
    <line x1="48" y1="18" x2="44" y2="8" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
    <circle cx="44" cy="7" r="4" fill="#38BDF8" stroke="#1E293B" stroke-width="2"/>
    <!-- Back Arm -->
    <path d="M34 50 L24 58 L29 63 L37 55 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Legs -->
    <path d="M39 71 L31 87 L40 90 L46 72 Z" fill="#3B82F6" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M50 71 L59 87 L67 84 L56 70 Z" fill="#3B82F6" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Thruster Boots -->
    <rect x="29" y="85" width="11" height="5" rx="2.5" fill="#38BDF8" stroke="#1E293B" stroke-width="2"/>
    <rect x="58" y="82" width="11" height="5" rx="2.5" fill="#38BDF8" stroke="#1E293B" stroke-width="2"/>
    <!-- Robot Torso -->
    <rect x="35" y="47" width="26" height="25" rx="8" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/>
    <rect x="40" y="52" width="16" height="12" rx="3" fill="#3B82F6" stroke="#1E293B" stroke-width="2"/>
    <!-- Core Power Bar -->
    <circle cx="48" cy="58" r="3.5" fill="#38BDF8"/>
    <!-- Front Arm -->
    <path d="M60 50 L72 44 L75 50 L62 57 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Robot Helmet -->
    <rect x="28" y="17" width="40" height="29" rx="13" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/>
    <!-- Ear Pods -->
    <rect x="24" y="26" width="5" height="11" rx="2.5" fill="#3B82F6" stroke="#1E293B" stroke-width="2"/>
    <rect x="67" y="26" width="5" height="11" rx="2.5" fill="#3B82F6" stroke="#1E293B" stroke-width="2"/>
    <!-- Digital Face Screen (shifted slightly right for right-facing direction) -->
    <rect x="34" y="22" width="30" height="19" rx="8" fill="#1E293B"/>
    <!-- LED Eyes & Mouth -->
    <path d="M40 30 L45 27 L45 33 Z" fill="#38BDF8"/>
           <circle cx="56" cy="30" r="3.5" fill="#38BDF8"/>
           <path d="M45 36 Q50 40 55 36" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>