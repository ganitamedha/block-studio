    <path d="M40 71 L39 89 L47 89 L47 71 Z" fill="#3B82F6" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M50 71 L52 89 L60 89 L57 71 Z" fill="#3B82F6" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Thruster Boots -->
    <rect x="37" y="86" width="11" height="5" rx="2.5" fill="#38BDF8" stroke="#1E293B" stroke-width="2"/>
    <rect x="50" y="86" width="11" height="5" rx="2.5" fill="#38BDF8" stroke="#1E293B" stroke-width="2"/>
    <!-- Robot Torso -->
    <rect x="35" y="47" width="26" height="25" rx="8" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/>
    <rect x="40" y="52" width="16" height="12" rx="3" fill="#3B82F6" stroke="#1E293B" stroke-width="2"/>
    <!-- Core Power Bar -->
    <circle cx="48" cy="58" r="3.5" fill="#38BDF8"/>
    <!-- Front Arm -->
    <path d="M60 50 L68 61 L62 65 L57 55 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Robot Helmet -->
    <rect x="28" y="17" width="40" height="29" rx="13" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/>
    <!-- Ear Pods -->
    <rect x="24" y="26" width="5" height="11" rx="2.5" fill="#3B82F6" stroke="#1E293B" stroke-width="2"/>
    <rect x="67" y="26" width="5" height="11" rx="2.5" fill="#3B82F6" stroke="#1E293B" stroke-width="2"/>
    <!-- Digital Face Screen (shifted slightly right for right-facing direction) -->
    <rect x="34" y="22" width="30" height="19" rx="8" fill="#1E293B"/>
    <!-- LED Eyes & Mouth -->
    <circle cx="43" cy="30" r="3.5" fill="#38BDF8"/>
           <circle cx="56" cy="30" r="3.5" fill="#38BDF8"/>
           <path d="M46 36 Q50 38.5 54 36" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
