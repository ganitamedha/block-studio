    <line x1="48" y1="18" x2="48" y2="8" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
    <circle cx="48" cy="7" r="4" fill="#38BDF8" stroke="#1E293B" stroke-width="2"/>
    <!-- Back Arm -->
    <path d="M34 50 L29 64 L35 66 L39 54 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round"/>
