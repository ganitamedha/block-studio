name: Build and Deploy Custom Scratch Studio

on:
  push:
    branches:
      - develop
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore Clean Core Files & Apply Safe Customizations
        run: |
          # 1. Restore official core files that caused the blank screen (keeps your mascot & logo untouched)
          BASE_URL="https://raw.githubusercontent.com/scratchfoundation/scratch-gui/develop"
          curl -sL "$BASE_URL/src/playground/index.css" > src/playground/index.css
          curl -sL "$BASE_URL/src/playground/render-gui.jsx" > src/playground/render-gui.jsx
          curl -sL "$BASE_URL/src/components/gui/gui.jsx" > src/components/gui/gui.jsx
          curl -sL "$BASE_URL/src/css/colors.css" > src/css/colors.css
          curl -sL "$BASE_URL/src/lib/themes/default/index.js" > src/lib/themes/default/index.js
          curl -sL "$BASE_URL/src/lib/storage.js" > src/lib/storage.js

          # 2. Safely remove "Share" / "See Project Page" (showComingSoon) & disable Backpack in render-gui.jsx
          sed -i 's/showComingSoon//g' src/playground/render-gui.jsx
          sed -i 's/backpackVisible/backpackVisible={false}/g' src/playground/render-gui.jsx
          sed -i 's|https://scratch.mit.edu|https://www.techmedha.in|g' src/playground/render-gui.jsx

          # 3. Safely update the 9 Block Category hex colors in-place without altering JS object structure
          sed -i 's/#4C97FF/#0284C7/gI; s/#4280D7/#0369A1/gI; s/#3373CC/#075985/gI' src/lib/themes/default/index.js
          sed -i 's/#9966FF/#7C3AED/gI; s/#855CD6/#6D28D9/gI; s/#774DCB/#5B21B6/gI' src/lib/themes/default/index.js
          sed -i 's/#CF63CF/#DB2777/gI; s/#C94FC9/#BE185D/gI; s/#BD42BD/#9D174D/gI' src/lib/themes/default/index.js
          sed -i 's/#FFAB19/#F59E0B/gI; s/#EC9C13/#D97706/gI; s/#CF8B17/#B45309/gI' src/lib/themes/default/index.js
          sed -i 's/#FFBF00/#EAB308/gI; s/#E6AC00/#CA8A04/gI; s/#CC9900/#A16207/gI' src/lib/themes/default/index.js
          sed -i 's/#5CB1D6/#0891B2/gI; s/#47A8D1/#0E7490/gI; s/#2E8EB8/#155E75/gI' src/lib/themes/default/index.js
          sed -i 's/#0FBD8C/#0D9488/gI; s/#0DA57A/#0F766E/gI; s/#0B8E69/#115E59/gI' src/lib/themes/default/index.js
          sed -i 's/#59C059/#10B981/gI; s/#46B946/#059669/gI; s/#389438/#047857/gI' src/lib/themes/default/index.js
          sed -i 's/#FF8C1A/#F97316/gI; s/#FF8000/#EA580C/gI; s/#DB6E00/#C2410C/gI' src/lib/themes/default/index.js
          sed -i 's/#FF661A/#EA580C/gI; s/#FF5500/#C2410C/gI; s/#E64D00/#9A3412/gI' src/lib/themes/default/index.js
          sed -i 's/#FF6680/#F43F5E/gI; s/#FF4D6A/#E11D48/gI; s/#FF3355/#BE123C/gI' src/lib/themes/default/index.js

          # 4. Switch src/lib/storage.js import to match scratch-storage@2.3.1 (Fixes Issue #9817)
          sed -i "s/import {ScratchStorage} from 'scratch-storage';/import ScratchStorage from 'scratch-storage';/g" src/lib/storage.js

      - name: Clean Install Dependencies & Apply Scratch-Storage 2.3.1 Fix
        run: |
          npm ci --ignore-scripts
          npm install scratch-storage@2.3.1 --no-save --legacy-peer-deps --ignore-scripts

      - name: Run Scratch Prepublish & Ensure Generated Assets Exist
        run: |
          node ./scripts/prepublish.mjs || true
          mkdir -p src/generated
          for file in $(grep -rhoE "generated/[a-zA-Z0-9._-]+(\.cjs|\.js)" src/ || true); do
            target="src/$file"
            if [ ! -f "$target" ]; then
              printf "module.exports = '';\n" > "$target"
            fi
          done

      - name: Build Custom Scratch GUI
        run: npx webpack --stats-error-details
        env:
          NODE_ENV: production
          CI: false
          NODE_OPTIONS: --max_old_space_size=6144

      - name: Inject Complete Landing Page UI/UX Theme into Built Studio
        run: |
          cat << 'EOF' > ./build/custom-theme.css
          @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Poppins:wght@500;600;700&display=swap');

          :root {
              --tm-header-start: #0D9488;
              --tm-header-end: #0284C7;
              --tm-workspace-bg: #F0FDFA;
              --tm-panel-bg: #E6FFFA;
              --tm-canvas-bg: #F8FAFC;
              --tm-border-color: #99F6E4;
              --tm-primary-accent: #0284C7;
              --tm-action-btn: #F97316;
              --tm-action-btn-hover: #EA580C;
              --tm-text-dark: #1E293B;
          }

          html, body {
              background-color: var(--tm-workspace-bg) !important;
              color: var(--tm-text-dark) !important;
              font-family: 'Poppins', 'Nunito', sans-serif !important;
          }

          button, input, select, textarea,
          [class*="menu-bar_"], [class*="gui_tab_"],
          [class*="sprite-info_"], [class*="sprite-selector_"],
          [class*="stage-selector_"] {
              font-family: 'Poppins', 'Nunito', sans-serif !important;
          }

          /* Top Header Menu Bar Gradient */
          [class*="menu-bar_menu-bar_"] {
              background: linear-gradient(90deg, var(--tm-header-start) 0%, var(--tm-header-end) 100%) !important;
              border-bottom: 2px solid #0F766E !important;
              box-shadow: 0 2px 10px rgba(13, 148, 136, 0.18) !important;
              color: #FFFFFF !important;
          }

          /* Main Workspace & Code / Costumes / Sounds Tabs */
          [class*="gui_body-wrapper_"] {
              background-color: var(--tm-workspace-bg) !important;
          }

          [class*="gui_tab_"] {
              background-color: #CCFBF1 !important;
              border: 1px solid var(--tm-border-color) !important;
              color: var(--tm-text-dark) !important;
              font-weight: 600 !important;
          }

          [class*="gui_tab_"][class*="gui_is-selected_"] {
              background-color: var(--tm-primary-accent) !important;
              border-color: var(--tm-primary-accent) !important;
              color: #FFFFFF !important;
          }

          [class*="gui_tab_"][class*="gui_is-selected_"] img {
              filter: brightness(0) invert(1);
          }

          /* Left Block Category Sidebar & Coding Canvas */
          .scratchCategoryMenu {
              background-color: #FFFFFF !important;
              border-right: 1px solid var(--tm-border-color) !important;
              color: var(--tm-text-dark) !important;
          }

          .blocklySvg {
              background-color: var(--tm-canvas-bg) !important;
          }

          [class*="gui_extension-button-container_"] {
              background: linear-gradient(135deg, #0D9488 0%, #0284C7 100%) !important;
              border-color: #0F766E !important;
          }

          /* Stage Frame & Sprite Panels */
          [class*="stage-header_stage-header-wrapper_"] {
              background-color: var(--tm-workspace-bg) !important;
          }

          [class*="stage_stage-wrapper_"] [class*="stage_stage_"] {
              border: 2px solid var(--tm-border-color) !important;
              border-radius: 12px !important;
          }

          [class*="sprite-info_sprite-info_"] {
              background-color: #FFFFFF !important;
              border-bottom: 1px solid var(--tm-border-color) !important;
              border-top-left-radius: 10px !important;
              border-top-right-radius: 10px !important;
              color: var(--tm-text-dark) !important;
          }

          [class*="sprite-selector_sprite-selector_"] {
              background-color: var(--tm-panel-bg) !important;
              border: 1.5px solid var(--tm-border-color) !important;
              border-radius: 10px !important;
          }

          [class*="stage-selector_stage-selector_"] {
              background-color: #FFFFFF !important;
              border: 1.5px solid var(--tm-border-color) !important;
              border-radius: 10px !important;
          }

          [class*="sprite-selector-item_is-selected_"] {
              border: 2.5px solid var(--tm-primary-accent) !important;
          }

          [class*="sprite-selector-item_sprite-info_"] {
              background-color: var(--tm-primary-accent) !important;
              color: #FFFFFF !important;
          }

          /* Coral Floating Action Buttons (Choose Sprite / Choose Backdrop) */
          [class*="action-menu_main-button_"] {
              background-color: var(--tm-action-btn) !important;
              box-shadow: 0 4px 12px rgba(249, 115, 22, 0.35) !important;
          }

          [class*="action-menu_main-button_"]:hover {
              background-color: var(--tm-action-btn-hover) !important;
          }

          [class*="action-menu_more-buttons-outer_"] {
              background-color: var(--tm-header-start) !important;
          }

          /* Library Modals */
          [class*="modal_header_"] {
              background: linear-gradient(90deg, var(--tm-header-start) 0%, var(--tm-header-end) 100%) !important;
          }

          /* Permanently Hide the Disabled Bottom Backpack Bar */
          [class*="backpack_backpack-container_"] {
              display: none !important;
          }
          EOF
          sed -i 's|</head>|<link rel="stylesheet" href="custom-theme.css"></head>|g' ./build/index.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Built Studio for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
