                                  '<button class="tm-share-close-btn" id="tm-login-close">✕</button>' +
                              '</div>' +
                              '<div class="tm-share-modal-body">' +
                                  '<div class="tm-profile-summary">' +
                                      '<div>' +
                                          '<div style="font-weight:700;color:#0F766E;">🏫 ' + (student.school || '') + '</div>' +
                                          '<div style="color:#475569;font-size:11.5px;">📍 ' + (student.area || '') + '</div>' +
                                      '</div>' +
                                      '<div style="text-align:right;">' +
                                          '<div style="font-size:10px;font-weight:700;color:#64748B;">PASSCODE</div>' +
                                          '<div class="tm-passcode-badge">' + (student.passcode || '') + '</div>' +
                                      '</div>' +
                                  '</div>' +
                                  '<div style="display:flex;gap:8px;">' +
                                      '<button class="tm-share-action-btn" id="tm-btn-save-vault" style="background: linear-gradient(90deg, #059669, #0D9488); flex: 1.4;">' +
                                          '💾 Save Project to Vault' +
                                      '</button>' +
                                      '<button class="tm-share-action-btn" id="tm-btn-id-card" style="background: #0284C7; flex: 1;">' +
                                          '🪪 Save ID Card' +
                                      '</button>' +
                                  '</div>' +
                                  '<div class="tm-share-field">' +
                                      '<label>📂 My Lifetime Saved Projects</label>' +
                                      '<div class="tm-project-list" id="tm-vault-list">Loading your projects...</div>' +
                                  '</div>' +
                                  '<button class="tm-share-action-btn" id="tm-btn-logout" style="background: #E11D48; margin-top: 2px;">' +
                                      '🚪 Sign Out / Switch Student' +
                                  '</button>' +
                              '</div>' +
                          '</div>';

                      document.body.appendChild(overlay);
                      document.getElementById('tm-login-close').onclick = function () { overlay.remove(); };
                      overlay.onclick = function (ev) { if (ev.target === overlay) overlay.remove(); };

                      function renderVaultList() {
                          var listEl = document.getElementById('tm-vault-list');
                          if (!listEl) return;
                          getStudentProjects(student, function (items) {
                              if (!items.length) {
                                  listEl.innerHTML = '<div style="text-align:center;color:#64748B;padding:12px;">No saved projects yet. Click "Save Project to Vault" above!</div>';
                                  return;
                              }
                              listEl.innerHTML = '';
                              items.forEach(function (proj) {
                                  var row = document.createElement('div');
                                  row.className = 'tm-project-item';
                                  row.innerHTML =
                                      '<div>' +
                                          '<div class="tm-project-item-title">' + proj.title + '</div>' +
                                          '<div class="tm-project-item-date">' + proj.updatedAt + '</div>' +
