                  function ensureShareUrlGenerated() {
                      return new Promise(async function (resolve) {
                          var projTitle = document.getElementById('tm-share-title').value.trim() || 'TechMedha Project';
                          var studentName = document.getElementById('tm-share-student').value.trim() || 'M.V.S.S. Mokshagna';
