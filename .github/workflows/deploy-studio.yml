              // IndexedDB Helper for Student's Saved Projects Vault
              function openProjectDB(callback) {
                  var req = indexedDB.open('TechMedhaStudioVault', 1);
                  req.onupgradeneeded = function (e) {
                      var db = e.target.result;
                      if (!db.objectStoreNames.contains('projects')) {
                          db.createObjectStore('projects', { keyPath: 'id' });
                      }
                  };
                  req.onsuccess = function (e) {
                      callback(e.target.result);
                  };
              }

              function saveProjectToStudentVault(student, title, sb3Blob, onDone) {
                  openProjectDB(function (db) {
                      var tx = db.transaction('projects', 'readwrite');
                      var store = tx.objectStore('projects');
                      var item = {
                          id: student.key + '__' + Date.now(),
                          studentKey: student.key,
                          passcode: student.passcode,
                          title: title,
                          updatedAt: new Date().toLocaleString(),
                          blob: sb3Blob
                      };
                      store.put(item);
                      tx.oncomplete = function () {
                          if (onDone) onDone();
                      };
                  });
              }

              function getStudentProjects(student, onResult) {
                  openProjectDB(function (db) {
                      var tx = db.transaction('projects', 'readonly');
                      var store = tx.objectStore('projects');
                      var req = store.getAll();
                      req.onsuccess = function () {
                          var all = req.result || [];
                          var filtered = all.filter(function (p) {
                              return p.studentKey === student.key || (student.passcode && p.passcode === student.passcode);
                          });
                          filtered.sort(function (a, b) { return b.id.localeCompare(a.id); });
                          onResult(filtered);
                      };
                  });
              }

              function deleteStudentProject(projectId, onDone) {
                  openProjectDB(function (db) {
                      var tx = db.transaction('projects', 'readwrite');
                      tx.objectStore('projects').delete(projectId);
                      tx.oncomplete = function () {
                          if (onDone) onDone();
                      };
                  });
              }

