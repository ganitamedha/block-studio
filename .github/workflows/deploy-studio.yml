name: Build and Deploy Custom Scratch Studio

on:
  push:
    branches:
      - develop
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clean Install Exact Locked Dependencies
        run: npm ci --ignore-scripts

      - name: Restore Core Files, Set Default Title to TechMedha Project & Patch Block Colors
        run: |
          # 1. Restore clean official core files via Git (keeps your MedhaBot mascot & logo untouched)
          git remote add upstream https://github.com/scratchfoundation/scratch-gui.git || true
          git fetch upstream develop --depth=1
          git checkout upstream/develop -- src/playground src/components/gui src/css src/lib/themes src/lib/make-toolbox-xml.js src/lib/storage.js src/reducers/vm.js src/reducers/project-title.js

          # 2. Expose Scratch VM globally as window.vm for Share & Student Account Project Saving
          sed -i 's/new VM()/(window.vm = new VM())/g' src/reducers/vm.js || true

          # 3. Remove disabled default MIT placeholders & point logo to https://www.techmedha.in/
          sed -i 's/showComingSoon//g' src/playground/render-gui.jsx || true
          sed -i 's|https://scratch.mit.edu|https://www.techmedha.in/|g' src/playground/render-gui.jsx || true

          # 4. Disable the bottom Backpack bar cleanly in gui.jsx
          sed -i 's/backpackVisible ?/false ?/g' src/components/gui/gui.jsx || true

          # 5. Patch all 9 Block Categories AND replace "Scratch Project" with "TechMedha Project"
          cat << 'EOF' > /tmp/patch-studio.cjs
          const fs = require('fs');
          const path = require('path');

          const colorMap = {
              // 1. MOTION (Electric Cobalt Blue)
              '#4C97FF': '#2563EB', '#4280D7': '#1D4ED8', '#3373CC': '#1E40AF',
              '#80B5FF': '#2563EB', '#B3D2FF': '#1D4ED8',

              // 2. LOOKS (Deep Royal Orchid)
              '#9966FF': '#9333EA', '#855CD6': '#7E22CE', '#774DCB': '#6B21A8',
              '#CCB3FF': '#9333EA', '#DDCCFF': '#7E22CE',

              // 3. SOUND (Crimson Rose)
              '#CF63CF': '#E11D48', '#D65CD6': '#E11D48', '#C94FC9': '#BE123C', '#BD42BD': '#9F1239',
              '#E19DE1': '#E11D48', '#FFCCFF': '#BE123C',

              // 4. EVENTS (Sunset Tangerine)
              '#FFBF00': '#EA580C', '#FFD500': '#EA580C', '#E6AC00': '#C2410C', '#CC9900': '#9A3412',
              '#FFE380': '#EA580C', '#FFECB3': '#C2410C',

              // 5. CONTROL (Warm Honey Gold)
              '#FFAB19': '#D97706', '#EC9C13': '#B45309', '#CF8B17': '#92400E',
              '#FFBE4C': '#D97706', '#FFD899': '#B45309',

              // 6. SENSING (Vibrant Lagoon Teal)
              '#5CB1D6': '#0D9488', '#4CBFE6': '#0D9488', '#47A8D1': '#0F766E', '#2E8EB8': '#115E59',
              '#85C4E0': '#0D9488', '#B3E0F2': '#0F766E',

              // 7. OPERATORS (Lush Jade Emerald)
              '#59C059': '#059669', '#40BF4A': '#059669', '#46B946': '#047857', '#389438': '#065F46',
              '#7ECE7E': '#059669', '#B3E6B3': '#047857',

              // 8. VARIABLES & LISTS (Ruby Red & Deep Brick)
              '#FF8C1A': '#DC2626', '#FF8000': '#B91C1C', '#DB6E00': '#991B1B',
              '#FFA54C': '#DC2626', '#FFCC99': '#B91C1C',
              '#FF661A': '#B91C1C', '#FF5500': '#991B1B', '#E64D00': '#7F1D1D',
              '#FF9966': '#B91C1C',

              // 9. MY BLOCKS (Electric Fuchsia)
              '#FF6680': '#C026D3', '#FF4D6A': '#A21CAF', '#FF3355': '#86198F',
              '#FF99AA': '#C026D3', '#FFCCD5': '#A21CAF',

              // 10. EXTENSIONS / PEN (Deep Ocean Cyan)
              '#0FBD8C': '#0284C7', '#0DA57A': '#0369A1', '#0B8E69': '#075985',
              '#13ECAF': '#0284C7', '#75F0CD': '#0369A1'
          };

          const colorRegex = new RegExp(Object.keys(colorMap).join('|'), 'gi');

          function walkAndPatch(dir, replaceTitle) {
              if (!fs.existsSync(dir)) return;
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                  const fullPath = path.join(dir, entry.name);
                  if (entry.isDirectory()) {
                      walkAndPatch(fullPath, replaceTitle);
                  } else if (/\.(js|jsx|mjs|cjs|json|css)$/.test(entry.name)) {
                      let content = fs.readFileSync(fullPath, 'utf8');
                      let updated = content.replace(colorRegex, match => colorMap[match.toUpperCase()] || match);
                      if (replaceTitle) {
                          updated = updated.replace(/Scratch Project/g, 'TechMedha Project');
                      }
                      if (updated !== content) {
                          fs.writeFileSync(fullPath, updated, 'utf8');
                      }
                  }
              }
          }

          walkAndPatch('src', true);
          walkAndPatch('node_modules/scratch-l10n', true);
          walkAndPatch('node_modules/scratch-blocks', false);
          walkAndPatch('node_modules/scratch-vm', false);
          console.log('Successfully patched default project title and all 9 block categories.');
          EOF
          node /tmp/patch-studio.cjs

      - name: Run Scratch Prepublish & Ensure Generated Assets Exist
        run: |
          node ./scripts/prepublish.mjs || true
          mkdir -p src/generated
          for file in $(grep -rhoE "generated/[a-zA-Z0-9._-]+(\.cjs|\.js)" src/ || true); do
            target="src/$file"
            if [ ! -f "$target" ]; then
              printf "module.exports = '';\n" > "$target"
            fi
          done

      - name: Build Custom Scratch GUI & Copy Storage Worker Chunks
        run: |
          npx webpack --stats-error-details
          mkdir -p ./build/chunks ./build/static/chunks
          find node_modules -path "*/scratch-storage/*" -name "*fetch-worker*" -exec cp {} ./build/chunks/ \; || true
          find node_modules -path "*/scratch-storage/*" -name "*fetch-worker*" -exec cp {} ./build/static/chunks/ \; || true
        env:
          NODE_ENV: production
          CI: false
          NODE_OPTIONS: --max_old_space_size=6144

      - name: Inject Complete UI/UX Theme, Share Modal, Student Login System & Worker Fix
        run: |
          cat << 'EOF' > ./build/custom-theme.css
          @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Poppins:wght@500;600;700&display=swap');

          :root {
              --tm-header-start: #0D9488;
              --tm-header-end: #0284C7;
              --tm-workspace-bg: #F0FDFA;
              --tm-panel-bg: #E6FFFA;
              --tm-canvas-bg: #F8FAFC;
              --tm-border-color: #99F6E4;
              --tm-primary-accent: #0284C7;
              --tm-action-btn: #F97316;
              --tm-action-btn-hover: #EA580C;
              --tm-text-dark: #1E293B;
          }

          html, body {
              background-color: var(--tm-workspace-bg) !important;
              color: var(--tm-text-dark) !important;
              font-family: 'Poppins', 'Nunito', sans-serif !important;
          }

          button, input, select, textarea,
          [class*="menu-bar_"], [class*="gui_tab_"],
          [class*="sprite-info_"], [class*="sprite-selector_"],
          [class*="stage-selector_"] {
              font-family: 'Poppins', 'Nunito', sans-serif !important;
          }

          /* Top Header Menu Bar Gradient & Clickable Logo */
          [class*="menu-bar_menu-bar_"] {
              background: linear-gradient(90deg, var(--tm-header-start) 0%, var(--tm-header-end) 100%) !important;
              border-bottom: 2px solid #0F766E !important;
              box-shadow: 0 2px 10px rgba(13, 148, 136, 0.18) !important;
              color: #FFFFFF !important;
          }

          [class*="menu-bar_scratch-logo_"] {
              cursor: pointer !important;
              transition: transform 0.15s ease;
          }

          [class*="menu-bar_scratch-logo_"]:hover {
              transform: scale(1.05);
          }

          /* Custom Share & Login Buttons in Top Menu Bar */
          .tm-share-header-btn,
          .tm-login-header-btn {
              display: inline-flex;
              align-items: center;
              gap: 6px;
              color: #FFFFFF;
              border: 1.5px solid rgba(255, 255, 255, 0.7);
              border-radius: 20px;
              padding: 5px 14px;
              margin-left: 8px;
              font-size: 13px;
              font-weight: 700;
              cursor: pointer;
              transition: all 0.15s ease;
              height: 32px;
              align-self: center;
              white-space: nowrap;
          }

          .tm-share-header-btn {
              background: linear-gradient(135deg, #F97316 0%, #EA580C 100%);
              box-shadow: 0 2px 8px rgba(249, 115, 22, 0.35);
          }

          .tm-share-header-btn:hover {
              background: linear-gradient(135deg, #EA580C 0%, #C2410C 100%);
              transform: translateY(-1px);
          }

          .tm-login-header-btn {
              background: rgba(255, 255, 255, 0.18);
              margin-right: 12px;
          }

          .tm-login-header-btn:hover {
              background: rgba(255, 255, 255, 0.3);
              transform: translateY(-1px);
          }

          .tm-login-header-btn.logged-in {
              background: linear-gradient(135deg, #059669 0%, #0D9488 100%);
              border-color: #A7F3D0;
          }

          /* Modal Overlay & Cards (Used by both Share & Student Login) */
          .tm-share-overlay {
              position: fixed;
              inset: 0;
              background: rgba(15, 23, 42, 0.65);
              backdrop-filter: blur(4px);
              display: flex;
              align-items: center;
              justify-content: center;
              z-index: 99999;
              font-family: 'Poppins', 'Nunito', sans-serif;
          }

          .tm-share-modal {
              background: #FFFFFF;
              width: 92%;
              max-width: 480px;
              border-radius: 16px;
              border: 2px solid #99F6E4;
              box-shadow: 0 20px 40px rgba(15, 23, 42, 0.25);
              overflow: hidden;
              color: #1E293B;
          }

          .tm-share-modal-header {
              background: linear-gradient(90deg, #0D9488 0%, #0284C7 100%);
              color: #FFFFFF;
              padding: 14px 20px;
              display: flex;
              align-items: center;
              justify-content: space-between;
              font-weight: 700;
              font-size: 16px;
          }

          .tm-share-close-btn {
              background: rgba(255, 255, 255, 0.2);
              border: none;
              color: #FFFFFF;
              width: 28px;
              height: 28px;
              border-radius: 50%;
              cursor: pointer;
              font-weight: 700;
              font-size: 15px;
          }

          .tm-share-modal-body {
              padding: 20px;
              display: flex;
              flex-direction: column;
              gap: 12px;
              max-height: 78vh;
              overflow-y: auto;
          }

          .tm-share-field label {
              display: block;
              font-size: 12px;
              font-weight: 700;
              color: #0F766E;
              margin-bottom: 4px;
              text-transform: uppercase;
          }

          .tm-share-field input {
              width: 100%;
              box-sizing: border-box;
              padding: 9px 12px;
              border: 1.5px solid #99F6E4;
              border-radius: 10px;
              font-size: 14px;
              font-weight: 600;
              color: #1E293B;
              background: #F0FDFA;
          }

          .tm-share-action-btn {
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 8px;
              width: 100%;
              padding: 11px 14px;
              border: none;
              border-radius: 10px;
              font-size: 14px;
              font-weight: 700;
              cursor: pointer;
              transition: transform 0.12s ease, opacity 0.12s ease;
              color: #FFFFFF;
          }

          .tm-share-action-btn:hover {
              transform: translateY(-1px);
              opacity: 0.96;
          }

          /* Saved Projects List inside Student Profile Modal */
          .tm-project-list {
              display: flex;
              flex-direction: column;
              gap: 8px;
              max-height: 210px;
              overflow-y: auto;
              border: 1.5px solid #CCFBF1;
              border-radius: 10px;
              padding: 10px;
              background: #F0FDFA;
          }

          .tm-project-item {
              display: flex;
              align-items: center;
              justify-content: space-between;
              background: #FFFFFF;
              padding: 8px 12px;
              border-radius: 8px;
              border: 1px solid #99F6E4;
              font-size: 13px;
          }

          .tm-project-item-title {
              font-weight: 700;
              color: #1E293B;
          }

          .tm-project-item-date {
              font-size: 11px;
              color: #64748B;
          }

          .tm-mini-btn {
              border: none;
              border-radius: 6px;
              padding: 5px 10px;
              font-size: 12px;
              font-weight: 700;
              cursor: pointer;
              color: #FFFFFF;
              margin-left: 4px;
          }

          /* Main Workspace & Code / Costumes / Sounds Tabs */
          [class*="gui_body-wrapper_"] {
              background-color: var(--tm-workspace-bg) !important;
          }

          [class*="gui_tab_"] {
              background-color: #CCFBF1 !important;
              border: 1px solid var(--tm-border-color) !important;
              color: var(--tm-text-dark) !important;
              font-weight: 600 !important;
          }

          [class*="gui_tab_"][class*="gui_is-selected_"] {
              background-color: var(--tm-primary-accent) !important;
              border-color: var(--tm-primary-accent) !important;
              color: #FFFFFF !important;
          }

          [class*="gui_tab_"][class*="gui_is-selected_"] img {
              filter: brightness(0) invert(1);
          }

          /* Left Block Category Sidebar & Coding Canvas */
          .scratchCategoryMenu {
              background-color: #FFFFFF !important;
              border-right: 1px solid var(--tm-border-color) !important;
              color: var(--tm-text-dark) !important;
          }

          .scratchCategoryId-motion .scratchCategoryItemBubble { background-color: #2563EB !important; border-color: #1E40AF !important; }
          .scratchCategoryId-looks .scratchCategoryItemBubble { background-color: #9333EA !important; border-color: #6B21A8 !important; }
          .scratchCategoryId-sound .scratchCategoryItemBubble { background-color: #E11D48 !important; border-color: #9F1239 !important; }
          .scratchCategoryId-events .scratchCategoryItemBubble { background-color: #EA580C !important; border-color: #9A3412 !important; }
          .scratchCategoryId-control .scratchCategoryItemBubble { background-color: #D97706 !important; border-color: #92400E !important; }
          .scratchCategoryId-sensing .scratchCategoryItemBubble { background-color: #0D9488 !important; border-color: #115E59 !important; }
          .scratchCategoryId-operators .scratchCategoryItemBubble { background-color: #059669 !important; border-color: #065F46 !important; }
          .scratchCategoryId-variables .scratchCategoryItemBubble { background-color: #DC2626 !important; border-color: #991B1B !important; }
          .scratchCategoryId-myBlocks .scratchCategoryItemBubble { background-color: #C026D3 !important; border-color: #86198F !important; }

          .blocklySvg {
              background-color: var(--tm-canvas-bg) !important;
          }

          [class*="gui_extension-button-container_"] {
              background: linear-gradient(135deg, #0D9488 0%, #0284C7 100%) !important;
              border-color: #0F766E !important;
          }

          /* Stage Frame & Sprite Panels */
          [class*="stage-header_stage-header-wrapper_"] {
              background-color: var(--tm-workspace-bg) !important;
          }

          [class*="stage_stage-wrapper_"] [class*="stage_stage_"] {
              border: 2px solid var(--tm-border-color) !important;
              border-radius: 12px !important;
          }

          [class*="sprite-info_sprite-info_"] {
              background-color: #FFFFFF !important;
              border-bottom: 1px solid var(--tm-border-color) !important;
              border-top-left-radius: 10px !important;
              border-top-right-radius: 10px !important;
              color: var(--tm-text-dark) !important;
          }

          [class*="sprite-selector_sprite-selector_"] {
              background-color: var(--tm-panel-bg) !important;
              border: 1.5px solid var(--tm-border-color) !important;
              border-radius: 10px !important;
          }

          [class*="stage-selector_stage-selector_"] {
              background-color: #FFFFFF !important;
              border: 1.5px solid var(--tm-border-color) !important;
              border-radius: 10px !important;
          }

          [class*="sprite-selector-item_is-selected_"] {
              border: 2.5px solid var(--tm-primary-accent) !important;
          }

          [class*="sprite-selector-item_sprite-info_"] {
              background-color: var(--tm-primary-accent) !important;
              color: #FFFFFF !important;
          }

          /* Coral Floating Action Buttons (Choose Sprite / Choose Backdrop) */
          [class*="action-menu_main-button_"] {
              background-color: var(--tm-action-btn) !important;
              box-shadow: 0 4px 12px rgba(249, 115, 22, 0.35) !important;
          }

          [class*="action-menu_main-button_"]:hover {
              background-color: var(--tm-action-btn-hover) !important;
          }

          [class*="action-menu_more-buttons-outer_"] {
              background-color: var(--tm-header-start) !important;
          }

          /* Library Modals */
          [class*="modal_header_"] {
              background: linear-gradient(90deg, var(--tm-header-start) 0%, var(--tm-header-end) 100%) !important;
          }

          /* Permanently Hide the Disabled Bottom Backpack Bar */
          [class*="backpack_backpack-container_"],
          [class*="backpack_backpack-header_"] {
              display: none !important;
          }
          EOF

          # Worker Fix + Logo Redirect + Default Title Fix + Share Modal + Student Login & Project Vault
          cat << 'EOF' > ./build/worker-fix.js
          (function () {
              var OriginalWorker = window.Worker;
              window.Worker = function (scriptURL, options) {
                  var urlStr = String(scriptURL);
                  if (urlStr.indexOf('/chunks/') !== -1 && urlStr.indexOf('/block-studio/chunks/') === -1) {
                      urlStr = urlStr.replace('/chunks/', '/block-studio/chunks/');
                  }
                  return new OriginalWorker(urlStr, options);
              };
              window.Worker.prototype = OriginalWorker.prototype;

              // 1. Redirect top-left Logo Click to https://www.techmedha.in/
              document.addEventListener('click', function (e) {
                  var logo = e.target && e.target.closest && e.target.closest('[class*="menu-bar_scratch-logo_"]');
                  if (logo) {
                      e.preventDefault();
                      e.stopPropagation();
                      var targetUrl = 'https://www.techmedha.in/';
                      if (window.self !== window.top) {
                          try {
                              window.top.location.href = targetUrl;
                          } catch (err) {
                              window.open(targetUrl, '_blank', 'noopener,noreferrer');
                          }
                      } else {
                          window.location.href = targetUrl;
                      }
                  }
              }, true);

              // Helper: Read & Write Current Logged-in Student Profile
              function getCurrentStudent() {
                  try {
                      var raw = localStorage.getItem('tm_student_profile');
                      return raw ? JSON.parse(raw) : null;
                  } catch (e) {
                      return null;
                  }
              }

              function setCurrentStudent(profile) {
                  if (profile) {
                      localStorage.setItem('tm_student_profile', JSON.stringify(profile));
                  } else {
                      localStorage.removeItem('tm_student_profile');
                  }
                  updateLoginButtonUI();
              }

              // Helper: Update React-controlled Project Title Input Box
              function setProjectTitleInput(newTitle) {
                  var input = document.querySelector('[class*="project-title-input_title-field_"]');
                  if (!input) return;
                  var nativeInputValueSetter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
                  nativeInputValueSetter.call(input, newTitle);
                  input.dispatchEvent(new Event('input', { bubbles: true }));
                  input.dispatchEvent(new Event('change', { bubbles: true }));
                  input.dispatchEvent(new Event('blur', { bubbles: true }));
              }

              function getProjectTitle() {
                  var input = document.querySelector('[class*="project-title-input_title-field_"]');
                  return (input && input.value && input.value.trim()) ? input.value.trim() : 'TechMedha Project';
              }

              function downloadBlob(blob, filename) {
                  var url = URL.createObjectURL(blob);
                  var a = document.createElement('a');
                  a.href = url;
                  a.download = filename;
                  document.body.appendChild(a);
                  a.click();
                  setTimeout(function () {
                      document.body.removeChild(a);
                      URL.revokeObjectURL(url);
                  }, 500);
              }

              // IndexedDB Helper for Student's Saved Projects Vault
              function openProjectDB(callback) {
                  var req = indexedDB.open('TechMedhaStudioVault', 1);
                  req.onupgradeneeded = function (e) {
                      var db = e.target.result;
                      if (!db.objectStoreNames.contains('projects')) {
                          db.createObjectStore('projects', { keyPath: 'id' });
                      }
                  };
                  req.onsuccess = function (e) {
                      callback(e.target.result);
                  };
              }

              function saveProjectToStudentVault(studentKey, title, sb3Blob, onDone) {
                  openProjectDB(function (db) {
                      var tx = db.transaction('projects', 'readwrite');
                      var store = tx.objectStore('projects');
                      var item = {
                          id: studentKey + '__' + Date.now(),
                          studentKey: studentKey,
                          title: title,
                          updatedAt: new Date().toLocaleString(),
                          blob: sb3Blob
                      };
                      store.put(item);
                      tx.oncomplete = function () {
                          if (onDone) onDone();
                      };
                  });
              }

              function getStudentProjects(studentKey, onResult) {
                  openProjectDB(function (db) {
                      var tx = db.transaction('projects', 'readonly');
                      var store = tx.objectStore('projects');
                      var req = store.getAll();
                      req.onsuccess = function () {
                          var all = req.result || [];
                          var filtered = all.filter(function (p) { return p.studentKey === studentKey; });
                          filtered.sort(function (a, b) { return b.id.localeCompare(a.id); });
                          onResult(filtered);
                      };
                  });
              }

              function deleteStudentProject(projectId, onDone) {
                  openProjectDB(function (db) {
                      var tx = db.transaction('projects', 'readwrite');
                      tx.objectStore('projects').delete(projectId);
                      tx.oncomplete = function () {
                          if (onDone) onDone();
                      };
                  });
              }

              // 2. Open Custom TechMedha Share Modal
              function openShareModal() {
                  var existing = document.getElementById('tm-share-overlay');
                  if (existing) existing.remove();

                  var student = getCurrentStudent();
                  var prefilledStudent = student ? (student.name + (student.grade ? ' (' + student.grade + ')' : '')) : '';
                  var defaultTitle = getProjectTitle();

                  var overlay = document.createElement('div');
                  overlay.id = 'tm-share-overlay';
                  overlay.className = 'tm-share-overlay';

                  overlay.innerHTML =
                      '<div class="tm-share-modal">' +
                          '<div class="tm-share-modal-header">' +
                              '<span>🚀 Share Your TechMedha Project</span>' +
                              '<button class="tm-share-close-btn" id="tm-share-close">✕</button>' +
                          '</div>' +
                          '<div class="tm-share-modal-body">' +
                              '<div class="tm-share-field">' +
                                  '<label>Project Title</label>' +
                                  '<input type="text" id="tm-share-title" value="' + defaultTitle.replace(/"/g, '&quot;') + '" />' +
                              '</div>' +
                              '<div class="tm-share-field">' +
                                  '<label>Creator / Student Name</label>' +
                                  '<input type="text" id="tm-share-student" placeholder="Enter your name (e.g., N.V.S.S. Prajwalita)" value="' + prefilledStudent.replace(/"/g, '&quot;') + '" />' +
                              '</div>' +
                              '<button class="tm-share-action-btn" id="tm-btn-snapshot" style="background: linear-gradient(90deg, #0D9488, #0284C7);">' +
                                  '📸 Download Project Showcase Card (.PNG)' +
                              '</button>' +
                              '<button class="tm-share-action-btn" id="tm-btn-native-share" style="background: linear-gradient(90deg, #F97316, #EA580C);">' +
                                  '📤 Share / Download Project File (.SB3)' +
                              '</button>' +
                              '<button class="tm-share-action-btn" id="tm-btn-whatsapp" style="background: #16A34A;">' +
                                  '💬 Share Project on WhatsApp' +
                              '</button>' +
                          '</div>' +
                      '</div>';

                  document.body.appendChild(overlay);

                  document.getElementById('tm-share-close').onclick = function () { overlay.remove(); };
                  overlay.onclick = function (ev) { if (ev.target === overlay) overlay.remove(); };

                  document.getElementById('tm-btn-snapshot').onclick = function () {
                      var projTitle = document.getElementById('tm-share-title').value.trim() || 'TechMedha Project';
                      var studentName = document.getElementById('tm-share-student').value.trim() || 'Young Innovator';

                      var stageCanvas = document.querySelector('[class*="stage_stage_"] canvas');
                      if (window.vm && window.vm.renderer && typeof window.vm.renderer.draw === 'function') {
                          window.vm.renderer.draw();
                      }

                      var cardCanvas = document.createElement('canvas');
                      cardCanvas.width = 640;
                      cardCanvas.height = 520;
                      var ctx = cardCanvas.getContext('2d');

                      ctx.fillStyle = '#F0FDFA';
                      ctx.fillRect(0, 0, 640, 520);
                      var grad = ctx.createLinearGradient(0, 0, 640, 0);
                      grad.addColorStop(0, '#0D9488');
                      grad.addColorStop(1, '#0284C7');
                      ctx.fillStyle = grad;
                      ctx.fillRect(0, 0, 640, 72);

                      ctx.fillStyle = '#FFFFFF';
                      ctx.font = 'bold 22px sans-serif';
                      ctx.fillText(projTitle, 24, 34);
                      ctx.font = '600 14px sans-serif';
                      ctx.fillText('Created by: ' + studentName, 24, 56);

                      ctx.fillStyle = '#FFFFFF';
                      ctx.fillRect(76, 90, 488, 368);
                      if (stageCanvas) {
                          ctx.drawImage(stageCanvas, 80, 94, 480, 360);
                      }

                      ctx.fillStyle = '#0F766E';
                      ctx.font = 'bold 15px sans-serif';
                      ctx.fillText('Built with TechMedha Block Coding Studio • www.techmedha.in', 95, 492);

                      cardCanvas.toBlob(function (blob) {
                          if (blob) downloadBlob(blob, projTitle.replace(/\s+/g, '-') + '-Showcase.png');
                      }, 'image/png');
                  };

                  document.getElementById('tm-btn-native-share').onclick = function () {
                      var projTitle = document.getElementById('tm-share-title').value.trim() || 'TechMedha-Project';
                      var studentName = document.getElementById('tm-share-student').value.trim();
                      var fileName = projTitle.replace(/\s+/g, '-') + '.sb3';

                      if (window.vm && typeof window.vm.saveProjectSb3 === 'function') {
                          window.vm.saveProjectSb3().then(function (blob) {
                              var file = new File([blob], fileName, { type: 'application/x.scratch.sb3' });
                              if (navigator.canShare && navigator.canShare({ files: [file] })) {
                                  navigator.share({
                                      title: projTitle,
                                      text: 'Check out "' + projTitle + '"' + (studentName ? ' by ' + studentName : '') + ' built on TechMedha Studio (https://www.techmedha.in/)!',
                                      files: [file]
                                  }).catch(function () {
                                      downloadBlob(blob, fileName);
                                  });
                              } else {
                                  downloadBlob(blob, fileName);
                              }
                          });
                      }
                  };

                  document.getElementById('tm-btn-whatsapp').onclick = function () {
                      var projTitle = document.getElementById('tm-share-title').value.trim() || 'TechMedha Project';
                      var studentName = document.getElementById('tm-share-student').value.trim();
                      var msg = '🌟 Check out the coding project *"' + projTitle + '"*' +
                          (studentName ? ' created by *' + studentName + '*' : '') +
                          ' on TechMedha Block Coding Studio! 🚀\nhttps://www.techmedha.in/';
                      window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(msg), '_blank', 'noopener,noreferrer');
                  };
              }

              // 3. Open Student Login & "My Saved Projects" Account Modal
              function openLoginModal() {
                  var existing = document.getElementById('tm-share-overlay');
                  if (existing) existing.remove();

                  var student = getCurrentStudent();
                  var overlay = document.createElement('div');
                  overlay.id = 'tm-share-overlay';
                  overlay.className = 'tm-share-overlay';

                  if (!student) {
                      // View A: Sign In Form
                      overlay.innerHTML =
                          '<div class="tm-share-modal">' +
                              '<div class="tm-share-modal-header">' +
                                  '<span>🎓 TechMedha Student Sign In</span>' +
                                  '<button class="tm-share-close-btn" id="tm-login-close">✕</button>' +
                              '</div>' +
                              '<div class="tm-share-modal-body">' +
                                  '<div class="tm-share-field">' +
                                      '<label>Student Full Name *</label>' +
                                      '<input type="text" id="tm-login-name" placeholder="e.g., M.V.S.S. Mokshagna" />' +
                                  '</div>' +
                                  '<div class="tm-share-field">' +
                                      '<label>Class / Grade *</label>' +
                                      '<input type="text" id="tm-login-grade" placeholder="e.g., Class 9" />' +
                                  '</div>' +
                                  '<div class="tm-share-field">' +
                                      '<label>Roll No. / Student ID (Optional)</label>' +
                                      '<input type="text" id="tm-login-roll" placeholder="e.g., Roll No. 14" />' +
                                  '</div>' +
                                  '<button class="tm-share-action-btn" id="tm-btn-do-login" style="background: linear-gradient(90deg, #0D9488, #0284C7); margin-top: 6px;">' +
                                      '✅ Sign In to My Studio Account' +
                                  '</button>' +
                              '</div>' +
                          '</div>';

                      document.body.appendChild(overlay);
                      document.getElementById('tm-login-close').onclick = function () { overlay.remove(); };
                      overlay.onclick = function (ev) { if (ev.target === overlay) overlay.remove(); };

                      document.getElementById('tm-btn-do-login').onclick = function () {
                          var name = document.getElementById('tm-login-name').value.trim();
                          var grade = document.getElementById('tm-login-grade').value.trim();
                          var roll = document.getElementById('tm-login-roll').value.trim();
                          if (!name) {
                              alert('Please enter your Student Name to sign in.');
                              return;
                          }
                          var studentKey = (name + '_' + grade + '_' + roll).toLowerCase().replace(/\s+/g, '_');
                          setCurrentStudent({ name: name, grade: grade || 'Student', roll: roll, key: studentKey });
                          overlay.remove();
                          openLoginModal();
                      };
                  } else {
                      // View B: Logged-In Student Dashboard & Saved Projects Vault
                      overlay.innerHTML =
                          '<div class="tm-share-modal">' +
                              '<div class="tm-share-modal-header">' +
                                  '<span>🎓 ' + student.name + ' (' + student.grade + ')</span>' +
                                  '<button class="tm-share-close-btn" id="tm-login-close">✕</button>' +
                              '</div>' +
                              '<div class="tm-share-modal-body">' +
                                  '<button class="tm-share-action-btn" id="tm-btn-save-vault" style="background: linear-gradient(90deg, #059669, #0D9488);">' +
                                      '💾 Save Current Project to My Account' +
                                  '</button>' +
                                  '<div class="tm-share-field">' +
                                      '<label>📂 My Saved Projects (In This Browser)</label>' +
                                      '<div class="tm-project-list" id="tm-vault-list">Loading your projects...</div>' +
                                  '</div>' +
                                  '<button class="tm-share-action-btn" id="tm-btn-logout" style="background: #E11D48; margin-top: 4px;">' +
                                      '🚪 Sign Out / Switch Student' +
                                  '</button>' +
                              '</div>' +
                          '</div>';

                      document.body.appendChild(overlay);
                      document.getElementById('tm-login-close').onclick = function () { overlay.remove(); };
                      overlay.onclick = function (ev) { if (ev.target === overlay) overlay.remove(); };

                      function renderVaultList() {
                          var listEl = document.getElementById('tm-vault-list');
                          if (!listEl) return;
                          getStudentProjects(student.key, function (items) {
                              if (!items.length) {
                                  listEl.innerHTML = '<div style="text-align:center;color:#64748B;padding:12px;">No saved projects yet. Click "Save Current Project" above!</div>';
                                  return;
                              }
                              listEl.innerHTML = '';
                              items.forEach(function (proj) {
                                  var row = document.createElement('div');
                                  row.className = 'tm-project-item';
                                  row.innerHTML =
                                      '<div>' +
                                          '<div class="tm-project-item-title">' + proj.title + '</div>' +
                                          '<div class="tm-project-item-date">' + proj.updatedAt + '</div>' +
                                      '</div>' +
                                      '<div>' +
                                          '<button class="tm-mini-btn" style="background:#0284C7;" data-action="load">▶ Load</button>' +
                                          '<button class="tm-mini-btn" style="background:#F97316;" data-action="dl">⬇</button>' +
                                          '<button class="tm-mini-btn" style="background:#E11D48;" data-action="del">🗑</button>' +
                                      '</div>';

                                  row.querySelector('[data-action="load"]').onclick = function () {
                                      if (window.vm && proj.blob) {
                                          proj.blob.arrayBuffer().then(function (buf) {
                                              window.vm.loadProject(buf).then(function () {
                                                  setProjectTitleInput(proj.title);
                                                  overlay.remove();
                                              });
                                          });
                                      }
                                  };
                                  row.querySelector('[data-action="dl"]').onclick = function () {
                                      downloadBlob(proj.blob, proj.title.replace(/\s+/g, '-') + '.sb3');
                                  };
                                  row.querySelector('[data-action="del"]').onclick = function () {
                                      deleteStudentProject(proj.id, renderVaultList);
                                  };
                                  listEl.appendChild(row);
                              });
                          });
                      }

                      renderVaultList();

                      document.getElementById('tm-btn-save-vault').onclick = function () {
                          var title = getProjectTitle();
                          if (window.vm && typeof window.vm.saveProjectSb3 === 'function') {
                              window.vm.saveProjectSb3().then(function (blob) {
                                  saveProjectToStudentVault(student.key, title, blob, function () {
                                      renderVaultList();
                                  });
                              });
                          }
                      };

                      document.getElementById('tm-btn-logout').onclick = function () {
                          setCurrentStudent(null);
                          overlay.remove();
                      };
                  }
              }

              function updateLoginButtonUI() {
                  var loginBtn = document.getElementById('tm-custom-login-btn');
                  if (!loginBtn) return;
                  var student = getCurrentStudent();
                  if (student) {
                      loginBtn.className = 'tm-login-header-btn logged-in';
                      loginBtn.innerHTML = '<span>🎓 ' + student.name + (student.grade ? ' (' + student.grade + ')' : '') + ' ▾</span>';
                  } else {
                      loginBtn.className = 'tm-login-header-btn';
                      loginBtn.innerHTML = '<span>👤 Student Login</span>';
                  }
              }

              // 4. Inject Share Button, Login Button & Enforce "TechMedha Project" Title
              function ensureStudioEnhancements() {
                  var titleInput = document.querySelector('[class*="project-title-input_title-field_"]');
                  if (titleInput && titleInput.value === 'Scratch Project') {
                      setProjectTitleInput('TechMedha Project');
                  }

                  if (!document.getElementById('tm-custom-share-btn') && titleInput && titleInput.parentElement) {
                      var shareBtn = document.createElement('button');
                      shareBtn.id = 'tm-custom-share-btn';
                      shareBtn.className = 'tm-share-header-btn';
                      shareBtn.type = 'button';
                      shareBtn.innerHTML = '<span>🚀 Share</span>';
                      shareBtn.onclick = openShareModal;
                      titleInput.parentElement.insertAdjacentElement('afterend', shareBtn);
                  }

                  if (!document.getElementById('tm-custom-login-btn')) {
                      var menuBar = document.querySelector('[class*="menu-bar_menu-bar_"]');
                      if (menuBar) {
                          var loginBtn = document.createElement('button');
                          loginBtn.id = 'tm-custom-login-btn';
                          loginBtn.type = 'button';
                          loginBtn.onclick = openLoginModal;
                          menuBar.appendChild(loginBtn);
                          updateLoginButtonUI();
                      }
                  }
              }

              setInterval(ensureStudioEnhancements, 800);
          })();
          EOF

          sed -i 's|</head>|<link rel="stylesheet" href="custom-theme.css"><script src="worker-fix.js"></script></head>|g' ./build/index.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Built Studio for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
