name: Build and Deploy Custom Scratch Studio

on:
  push:
    branches:
      - develop
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies (Bypass Legacy Prepublish Failure)
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Generate Required Microbit Hex Stub for Webpack
        run: |
          mkdir -p src/generated
          printf "module.exports = '';\n" > src/generated/microbit-hex-url.cjs

      - name: Build Custom Scratch GUI
        run: npm run build
        env:
          CI: false
          NODE_OPTIONS: --max_old_space_size=6144

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Built Studio for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
