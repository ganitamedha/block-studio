                              '</div>' +
                              '<div class="tm-share-modal-body">' +
                                  '<div class="tm-share-field">' +
                                      '<label>6-Character Passcode / Secret ID * (Custom or Generate)</label>' +
                                      '<div class="tm-passcode-row">' +
                                          '<input type="text" id="tm-login-passcode" class="tm-passcode-input" maxlength="6" placeholder="e.g. TM4829" />' +
                                          '<button type="button" class="tm-gen-btn" id="tm-btn-gen-code">🎲 Auto-Generate</button>' +
                                      '</div>' +
                                  '</div>' +
                                  '<div class="tm-hint-box">' +
                                      '💡 <b>Returning Student?</b> Type your 6-character code above to auto-fill your details! <b>New Student?</b> Type any 6-digit/letter code or click <b>Auto-Generate</b>.' +
                                  '</div>' +
                                  '<div class="tm-share-field">' +
                                      '<label>Student Full Name *</label>' +
                                      '<input type="text" id="tm-login-name" placeholder="e.g., M.V.S.S. Mokshagna" />' +
                                  '</div>' +
                                  '<div class="tm-share-field">' +
                                      '<label>School Name *</label>' +
                                      '<input type="text" id="tm-login-school" placeholder="e.g., Techmedha High School" />' +
                                  '</div>' +
                                  '<div class="tm-share-field">' +
                                      '<label>Area / State *</label>' +
                                      '<input type="text" id="tm-login-area" placeholder="e.g., Dilsukhnagar, Hyderabad, TS" />' +
                                  '</div>' +
                                  '<button class="tm-share-action-btn" id="tm-btn-do-login" style="background: linear-gradient(90deg, #0D9488, #0284C7); margin-top: 4px;">' +
                                      '🔓 Open My Lifetime Project Vault' +
                                  '</button>' +
                              '</div>' +
                          '</div>';

                      document.body.appendChild(overlay);
                      document.getElementById('tm-login-close').onclick = function () { overlay.remove(); };
                      overlay.onclick = function (ev) { if (ev.target === overlay) overlay.remove(); };

                      var passInput = document.getElementById('tm-login-passcode');
                      var nameInput = document.getElementById('tm-login-name');
                      var schoolInput = document.getElementById('tm-login-school');
                      var areaInput = document.getElementById('tm-login-area');

                      passInput.oninput = function () {
                          var clean = passInput.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
                          if (passInput.value !== clean) passInput.value = clean;
                          if (clean.length === 6) {
                              var dir = getStudentDirectory();
                              if (dir[clean]) {
                                  if (!nameInput.value) nameInput.value = dir[clean].name || '';
                                  if (!schoolInput.value) schoolInput.value = dir[clean].school || '';
                                  if (!areaInput.value) areaInput.value = dir[clean].area || '';
                              }
                          }
                      };

                      document.getElementById('tm-btn-gen-code').onclick = function () {
                          var dir = getStudentDirectory();
                          var newCode = generateSixCharCode();
                          while (dir[newCode]) {
                              newCode = generateSixCharCode();
                          }
                          passInput.value = newCode;
                      };

                      document.getElementById('tm-btn-do-login').onclick = function () {
                          var passcode = passInput.value.toUpperCase().replace(/[^A-Z0-9]/g, '').trim();
                          var name = nameInput.value.trim();
                          var school = schoolInput.value.trim();
                          var area = areaInput.value.trim();

                          if (passcode.length !== 6) {
                              alert('Please enter a 6-character Passcode (letters/numbers) or click "Auto-Generate".');
                              return;
                          }
                          if (!name) {
                              alert('Please enter your Student Full Name (e.g., M.V.S.S. Mokshagna).');
                              return;
                          }
                          if (!school) {
                              alert('Please enter your School Name (e.g., Techmedha High School).');
                              return;
                          }

                          var studentKey = 'vault_' + passcode;
                          setCurrentStudent({
                              name: name,
                              school: school,
                              area: area || 'Dilsukhnagar, Hyderabad, TS',
                              passcode: passcode,
                              key: studentKey
