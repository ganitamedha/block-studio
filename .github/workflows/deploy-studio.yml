name: Build and Deploy Custom Scratch Studio

on:
  push:
    branches:
      - develop
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clean Install Exact Locked Dependencies
        run: npm ci --ignore-scripts

      - name: Restore Core Files, Set Default Title to TechMedha Project & Patch Block Colors
        run: |
          # 1. Restore clean official core files via Git (keeps your MedhaBot mascot & logo untouched)
          git remote add upstream https://github.com/scratchfoundation/scratch-gui.git || true
          git fetch upstream develop --depth=1
          git checkout upstream/develop -- src/playground src/components/gui src/css src/lib/themes src/lib/make-toolbox-xml.js src/lib/storage.js src/reducers/vm.js src/reducers/project-title.js

          # 2. Expose Scratch VM globally as window.vm for Share, QR Link & Student Account Project Saving
          sed -i 's/new VM()/(window.vm = new VM())/g' src/reducers/vm.js || true

          # 3. Remove disabled default MIT placeholders & point logo to https://www.techmedha.in/
          sed -i 's/showComingSoon//g' src/playground/render-gui.jsx || true
          sed -i 's|https://scratch.mit.edu|https://www.techmedha.in/|g' src/playground/render-gui.jsx || true

          # 4. Disable the bottom Backpack bar cleanly in gui.jsx
          sed -i 's/backpackVisible ?/false ?/g' src/components/gui/gui.jsx || true

          # 5. Patch all 9 Block Categories AND replace "Scratch Project" with "TechMedha Project"
          cat << 'EOF' > /tmp/patch-studio.cjs
          const fs = require('fs');
          const path = require('path');

          const colorMap = {
              // 1. MOTION (Electric Cobalt Blue)
              '#4C97FF': '#2563EB', '#4280D7': '#1D4ED8', '#3373CC': '#1E40AF',
              '#80B5FF': '#2563EB', '#B3D2FF': '#1D4ED8',

              // 2. LOOKS (Deep Royal Orchid)
              '#9966FF': '#9333EA', '#855CD6': '#7E22CE', '#774DCB': '#6B21A8',
              '#CCB3FF': '#9333EA', '#DDCCFF': '#7E22CE',

              // 3. SOUND (Crimson Rose)
              '#CF63CF': '#E11D48', '#D65CD6': '#E11D48', '#C94FC9': '#BE123C', '#BD42BD': '#9F1239',
              '#E19DE1': '#E11D48', '#FFCCFF': '#BE123C',

              // 4. EVENTS (Sunset Tangerine)
              '#FFBF00': '#EA580C', '#FFD500': '#EA580C', '#E6AC00': '#C2410C', '#CC9900': '#9A3412',
              '#FFE380': '#EA580C', '#FFECB3': '#C2410C',

              // 5. CONTROL (Warm Honey Gold)
              '#FFAB19': '#D97706', '#EC9C13': '#B45309', '#CF8B17': '#92400E',
              '#FFBE4C': '#D97706', '#FFD899': '#B45309',

              // 6. SENSING (Vibrant Lagoon Teal)
              '#5CB1D6': '#0D9488', '#4CBFE6': '#0D9488', '#47A8D1': '#0F766E', '#2E8EB8': '#115E59',
              '#85C4E0': '#0D9488', '#B3E0F2': '#0F766E',

              // 7. OPERATORS (Lush Jade Emerald)
              '#59C059': '#059669', '#40BF4A': '#059669', '#46B946': '#047857', '#389438': '#065F46',
              '#7ECE7E': '#059669', '#B3E6B3': '#047857',

              // 8. VARIABLES & LISTS (Ruby Red & Deep Brick)
              '#FF8C1A': '#DC2626', '#FF8000': '#B91C1C', '#DB6E00': '#991B1B',
              '#FFA54C': '#DC2626', '#FFCC99': '#B91C1C',
              '#FF661A': '#B91C1C', '#FF5500': '#991B1B', '#E64D00': '#7F1D1D',
              '#FF9966': '#B91C1C',

              // 9. MY BLOCKS (Electric Fuchsia)
              '#FF6680': '#C026D3', '#FF4D6A': '#A21CAF', '#FF3355': '#86198F',
              '#FF99AA': '#C026D3', '#FFCCD5': '#A21CAF',

              // 10. EXTENSIONS / PEN (Deep Ocean Cyan)
              '#0FBD8C': '#0284C7', '#0DA57A': '#0369A1', '#0B8E69': '#075985',
              '#13ECAF': '#0284C7', '#75F0CD': '#0369A1'
          };

          const colorRegex = new RegExp(Object.keys(colorMap).join('|'), 'gi');

          function walkAndPatch(dir, replaceTitle) {
              if (!fs.existsSync(dir)) return;
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                  const fullPath = path.join(dir, entry.name);
                  if (entry.isDirectory()) {
                      walkAndPatch(fullPath, replaceTitle);
                  } else if (/\.(js|jsx|mjs|cjs|json|css)$/.test(entry.name)) {
                      let content = fs.readFileSync(fullPath, 'utf8');
                      let updated = content.replace(colorRegex, match => colorMap[match.toUpperCase()] || match);
                      if (replaceTitle) {
                          updated = updated.replace(/Scratch Project/g, 'TechMedha Project');
                      }
                      if (updated !== content) {
                          fs.writeFileSync(fullPath, updated, 'utf8');
                      }
                  }
              }
          }

          walkAndPatch('src', true);
          walkAndPatch('node_modules/scratch-l10n', true);
          walkAndPatch('node_modules/scratch-blocks', false);
          walkAndPatch('node_modules/scratch-vm', false);
          console.log('Successfully patched default project title and all 9 block categories.');
          EOF
          node /tmp/patch-studio.cjs

      - name: Run Scratch Prepublish & Ensure Generated Assets Exist
        run: |
          node ./scripts/prepublish.mjs || true
          mkdir -p src/generated
          for file in $(grep -rhoE "generated/[a-zA-Z0-9._-]+(\.cjs|\.js)" src/ || true); do
            target="src/$file"
            if [ ! -f "$target" ]; then
              printf "module.exports = '';\n" > "$target"
            fi
          done

      - name: Build Custom Scratch GUI & Copy Storage Worker Chunks
        run: |
          npx webpack --stats-error-details
          mkdir -p ./build/chunks ./build/static/chunks
          find node_modules -path "*/scratch-storage/*" -name "*fetch-worker*" -exec cp {} ./build/chunks/ \; || true
          find node_modules -path "*/scratch-storage/*" -name "*fetch-worker*" -exec cp {} ./build/static/chunks/ \; || true
        env:
          NODE_ENV: production
          CI: false
          NODE_OPTIONS: --max_old_space_size=6144

      - name: Inject Complete UI/UX Theme, QR Code Share System, Lifetime Student Vault & Worker Fix
        run: |
          cat << 'EOF' > ./build/custom-theme.css
          @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Poppins:wght@500;600;700&display=swap');

          :root {
              --tm-header-start: #0D9488;
              --tm-header-end: #0284C7;
              --tm-workspace-bg: #F0FDFA;
              --tm-panel-bg: #E6FFFA;
              --tm-canvas-bg: #F8FAFC;
              --tm-border-color: #99F6E4;
              --tm-primary-accent: #0284C7;
              --tm-action-btn: #F97316;
              --tm-action-btn-hover: #EA580C;
              --tm-text-dark: #1E293B;
          }

          html, body {
              background-color: var(--tm-workspace-bg) !important;
              color: var(--tm-text-dark) !important;
              font-family: 'Poppins', 'Nunito', sans-serif !important;
          }

          button, input, select, textarea,
          [class*="menu-bar_"], [class*="gui_tab_"],
          [class*="sprite-info_"], [class*="sprite-selector_"],
          [class*="stage-selector_"] {
              font-family: 'Poppins', 'Nunito', sans-serif !important;
          }

          /* Top Header Menu Bar Gradient & Clickable Logo */
          [class*="menu-bar_menu-bar_"] {
              background: linear-gradient(90deg, var(--tm-header-start) 0%, var(--tm-header-end) 100%) !important;
              border-bottom: 2px solid #0F766E !important;
              box-shadow: 0 2px 10px rgba(13, 148, 136, 0.18) !important;
              color: #FFFFFF !important;
          }

          [class*="menu-bar_scratch-logo_"] {
              cursor: pointer !important;
              transition: transform 0.15s ease;
          }

          [class*="menu-bar_scratch-logo_"]:hover {
              transform: scale(1.05);
          }

          /* Custom Share & Login Buttons in Top Menu Bar */
          .tm-share-header-btn,
          .tm-login-header-btn {
              display: inline-flex;
              align-items: center;
              gap: 6px;
              color: #FFFFFF;
              border: 1.5px solid rgba(255, 255, 255, 0.7);
              border-radius: 20px;
              padding: 5px 14px;
              margin-left: 8px;
              font-size: 13px;
              font-weight: 700;
              cursor: pointer;
              transition: all 0.15s ease;
              height: 32px;
              align-self: center;
              white-space: nowrap;
          }

          .tm-share-header-btn {
              background: linear-gradient(135deg, #F97316 0%, #EA580C 100%);
              box-shadow: 0 2px 8px rgba(249, 115, 22, 0.35);
          }

          .tm-share-header-btn:hover {
              background: linear-gradient(135deg, #EA580C 0%, #C2410C 100%);
              transform: translateY(-1px);
          }

          .tm-login-header-btn {
              background: rgba(255, 255, 255, 0.18);
              margin-right: 12px;
          }

          .tm-login-header-btn:hover {
              background: rgba(255, 255, 255, 0.3);
              transform: translateY(-1px);
          }

          .tm-login-header-btn.logged-in {
              background: linear-gradient(135deg, #059669 0%, #0D9488 100%);
              border-color: #A7F3D0;
          }

          /* Modal Overlay & Cards */
          .tm-share-overlay {
              position: fixed;
              inset: 0;
              background: rgba(15, 23, 42, 0.65);
              backdrop-filter: blur(4px);
              display: flex;
              align-items: center;
              justify-content: center;
              z-index: 99999;
              font-family: 'Poppins', 'Nunito', sans-serif;
          }

          .tm-share-modal {
              background: #FFFFFF;
              width: 94%;
              max-width: 520px;
              border-radius: 16px;
              border: 2px solid #99F6E4;
              box-shadow: 0 20px 40px rgba(15, 23, 42, 0.25);
              overflow: hidden;
              color: #1E293B;
          }

          .tm-share-modal-header {
              background: linear-gradient(90deg, #0D9488 0%, #0284C7 100%);
              color: #FFFFFF;
              padding: 14px 20px;
              display: flex;
              align-items: center;
              justify-content: space-between;
              font-weight: 700;
              font-size: 16px;
          }

          .tm-share-close-btn {
              background: rgba(255, 255, 255, 0.2);
              border: none;
              color: #FFFFFF;
              width: 28px;
              height: 28px;
              border-radius: 50%;
              cursor: pointer;
              font-weight: 700;
              font-size: 15px;
          }

          .tm-share-modal-body {
              padding: 18px 20px;
              display: flex;
              flex-direction: column;
              gap: 11px;
              max-height: 82vh;
              overflow-y: auto;
          }

          .tm-share-field label {
              display: block;
              font-size: 11.5px;
              font-weight: 700;
              color: #0F766E;
              margin-bottom: 4px;
              text-transform: uppercase;
          }

          .tm-share-field input {
              width: 100%;
              box-sizing: border-box;
              padding: 8px 12px;
              border: 1.5px solid #99F6E4;
              border-radius: 10px;
              font-size: 13.5px;
              font-weight: 600;
              color: #1E293B;
              background: #F0FDFA;
          }

          /* QR Code & Shareable Link Box */
          .tm-qr-box {
              display: none;
              background: #F0FDFA;
              border: 2px dashed #0D9488;
              border-radius: 12px;
              padding: 12px;
              text-align: center;
              flex-direction: column;
              align-items: center;
              gap: 8px;
          }

          .tm-qr-box.active {
              display: flex;
          }

          .tm-qr-canvas-wrap {
              background: #FFFFFF;
              padding: 10px;
              border-radius: 12px;
              border: 2px solid #99F6E4;
              display: inline-flex;
              align-items: center;
              justify-content: center;
              box-shadow: 0 4px 12px rgba(13, 148, 136, 0.12);
          }

          .tm-link-copy-row {
              display: flex;
              width: 100%;
              gap: 6px;
          }

          .tm-link-copy-row input {
              flex: 1;
              padding: 7px 10px;
              border: 1.5px solid #0284C7;
              border-radius: 8px;
              font-size: 12px;
              font-weight: 600;
              color: #0F766E;
              background: #FFFFFF;
          }

          .tm-passcode-row {
              display: flex;
              gap: 8px;
              align-items: stretch;
          }

          .tm-passcode-input {
              letter-spacing: 3px;
              font-size: 16px !important;
              font-weight: 800 !important;
              text-transform: uppercase;
              text-align: center;
              background: #FFFFFF !important;
              border: 2px solid #0284C7 !important;
          }

          .tm-gen-btn {
              background: linear-gradient(135deg, #F97316 0%, #EA580C 100%);
              color: #FFFFFF;
              border: none;
              border-radius: 10px;
              padding: 0 14px;
              font-size: 12px;
              font-weight: 700;
              cursor: pointer;
              white-space: nowrap;
              transition: transform 0.12s ease;
          }

          .tm-hint-box {
              font-size: 11.5px;
              color: #475569;
              background: #E6FFFA;
              border: 1px solid #99F6E4;
              border-radius: 8px;
              padding: 8px 10px;
              line-height: 1.4;
          }

          .tm-profile-summary {
              background: #F0FDFA;
              border: 1.5px solid #99F6E4;
              border-radius: 10px;
              padding: 10px 14px;
              display: flex;
              align-items: center;
              justify-content: space-between;
              font-size: 12.5px;
          }

          .tm-passcode-badge {
              background: #0284C7;
              color: #FFFFFF;
              padding: 4px 10px;
              border-radius: 8px;
              font-weight: 800;
              letter-spacing: 1.5px;
              font-size: 13px;
          }

          .tm-share-action-btn {
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 8px;
              width: 100%;
              padding: 10px 14px;
              border: none;
              border-radius: 10px;
              font-size: 13.5px;
              font-weight: 700;
              cursor: pointer;
              transition: transform 0.12s ease, opacity 0.12s ease;
              color: #FFFFFF;
          }

          .tm-share-action-btn:hover {
              transform: translateY(-1px);
              opacity: 0.96;
          }

          /* Toast Notification Banner for Shared Project Loading */
          .tm-toast-banner {
              position: fixed;
              bottom: 18px;
              right: 18px;
              background: linear-gradient(90deg, #0D9488 0%, #0284C7 100%);
              color: #FFFFFF;
              padding: 12px 18px;
              border-radius: 12px;
              font-weight: 700;
              font-size: 13.5px;
              box-shadow: 0 10px 25px rgba(15, 23, 42, 0.25);
              z-index: 99998;
              border: 2px solid #99F6E4;
          }

          /* Saved Projects List inside Student Profile Modal */
          .tm-project-list {
              display: flex;
              flex-direction: column;
              gap: 8px;
              max-height: 190px;
              overflow-y: auto;
              border: 1.5px solid #CCFBF1;
              border-radius: 10px;
              padding: 10px;
              background: #F0FDFA;
          }

          .tm-project-item {
              display: flex;
              align-items: center;
              justify-content: space-between;
              background: #FFFFFF;
              padding: 8px 12px;
              border-radius: 8px;
              border: 1px solid #99F6E4;
              font-size: 13px;
          }

          .tm-project-item-title {
              font-weight: 700;
              color: #1E293B;
          }

          .tm-project-item-date {
              font-size: 11px;
              color: #64748B;
          }

          .tm-mini-btn {
              border: none;
              border-radius: 6px;
              padding: 5px 10px;
              font-size: 12px;
              font-weight: 700;
              cursor: pointer;
              color: #FFFFFF;
              margin-left: 4px;
          }

          /* Main Workspace & Code / Costumes / Sounds Tabs */
          [class*="gui_body-wrapper_"] {
              background-color: var(--tm-workspace-bg) !important;
          }

          [class*="gui_tab_"] {
              background-color: #CCFBF1 !important;
              border: 1px solid var(--tm-border-color) !important;
              color: var(--tm-text-dark) !important;
              font-weight: 600 !important;
          }

          [class*="gui_tab_"][class*="gui_is-selected_"] {
              background-color: var(--tm-primary-accent) !important;
              border-color: var(--tm-primary-accent) !important;
              color: #FFFFFF !important;
          }

          [class*="gui_tab_"][class*="gui_is-selected_"] img {
              filter: brightness(0) invert(1);
          }

          /* Left Block Category Sidebar & Coding Canvas */
          .scratchCategoryMenu {
              background-color: #FFFFFF !important;
              border-right: 1px solid var(--tm-border-color) !important;
              color: var(--tm-text-dark) !important;
          }

          .scratchCategoryId-motion .scratchCategoryItemBubble { background-color: #2563EB !important; border-color: #1E40AF !important; }
          .scratchCategoryId-looks .scratchCategoryItemBubble { background-color: #9333EA !important; border-color: #6B21A8 !important; }
          .scratchCategoryId-sound .scratchCategoryItemBubble { background-color: #E11D48 !important; border-color: #9F1239 !important; }
          .scratchCategoryId-events .scratchCategoryItemBubble { background-color: #EA580C !important; border-color: #9A3412 !important; }
          .scratchCategoryId-control .scratchCategoryItemBubble { background-color: #D97706 !important; border-color: #92400E !important; }
          .scratchCategoryId-sensing .scratchCategoryItemBubble { background-color: #0D9488 !important; border-color: #115E59 !important; }
          .scratchCategoryId-operators .scratchCategoryItemBubble { background-color: #059669 !important; border-color: #065F46 !important; }
          .scratchCategoryId-variables .scratchCategoryItemBubble { background-color: #DC2626 !important; border-color: #991B1B !important; }
          .scratchCategoryId-myBlocks .scratchCategoryItemBubble { background-color: #C026D3 !important; border-color: #86198F !important; }

          .blocklySvg {
              background-color: var(--tm-canvas-bg) !important;
          }

          [class*="gui_extension-button-container_"] {
              background: linear-gradient(135deg, #0D9488 0%, #0284C7 100%) !important;
              border-color: #0F766E !important;
          }

          /* Stage Frame & Sprite Panels */
          [class*="stage-header_stage-header-wrapper_"] {
              background-color: var(--tm-workspace-bg) !important;
          }

          [class*="stage_stage-wrapper_"] [class*="stage_stage_"] {
              border: 2px solid var(--tm-border-color) !important;
              border-radius: 12px !important;
          }

          [class*="sprite-info_sprite-info_"] {
              background-color: #FFFFFF !important;
              border-bottom: 1px solid var(--tm-border-color) !important;
              border-top-left-radius: 10px !important;
              border-top-right-radius: 10px !important;
              color: var(--tm-text-dark) !important;
          }

          [class*="sprite-selector_sprite-selector_"] {
              background-color: var(--tm-panel-bg) !important;
              border: 1.5px solid var(--tm-border-color) !important;
              border-radius: 10px !important;
          }

          [class*="stage-selector_stage-selector_"] {
              background-color: #FFFFFF !important;
              border: 1.5px solid var(--tm-border-color) !important;
              border-radius: 10px !important;
          }

          [class*="sprite-selector-item_is-selected_"] {
              border: 2.5px solid var(--tm-primary-accent) !important;
          }

          [class*="sprite-selector-item_sprite-info_"] {
              background-color: var(--tm-primary-accent) !important;
              color: #FFFFFF !important;
          }

          /* Coral Floating Action Buttons (Choose Sprite / Choose Backdrop) */
          [class*="action-menu_main-button_"] {
              background-color: var(--tm-action-btn) !important;
              box-shadow: 0 4px 12px rgba(249, 115, 22, 0.35) !important;
          }

          [class*="action-menu_main-button_"]:hover {
              background-color: var(--tm-action-btn-hover) !important;
          }

          [class*="action-menu_more-buttons-outer_"] {
              background-color: var(--tm-header-start) !important;
          }

          /* Library Modals */
          [class*="modal_header_"] {
              background: linear-gradient(90deg, var(--tm-header-start) 0%, var(--tm-header-end) 100%) !important;
          }

          /* Permanently Hide the Disabled Bottom Backpack Bar */
          [class*="backpack_backpack-container_"],
          [class*="backpack_backpack-header_"] {
              display: none !important;
          }
          EOF

          # Worker Fix + Logo Redirect + QR Code Share Link System + Lifetime 6-Char Passcode Student Vault
          cat << 'EOF' > ./build/worker-fix.js
          (function () {
              var OriginalWorker = window.Worker;
              window.Worker = function (scriptURL, options) {
                  var urlStr = String(scriptURL);
                  if (urlStr.indexOf('/chunks/') !== -1 && urlStr.indexOf('/block-studio/chunks/') === -1) {
                      urlStr = urlStr.replace('/chunks/', '/block-studio/chunks/');
                  }
                  return new OriginalWorker(urlStr, options);
              };
              window.Worker.prototype = OriginalWorker.prototype;

              // Load QRious HTML5 Canvas QR Generator Library
              (function loadQRious() {
                  if (window.QRious) return;
                  var s = document.createElement('script');
                  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js';
                  s.async = true;
                  document.head.appendChild(s);
              })();

              // 1. Redirect top-left Logo Click to https://www.techmedha.in/
              document.addEventListener('click', function (e) {
                  var logo = e.target && e.target.closest && e.target.closest('[class*="menu-bar_scratch-logo_"]');
                  if (logo) {
                      e.preventDefault();
                      e.stopPropagation();
                      var targetUrl = 'https://www.techmedha.in/';
                      if (window.self !== window.top) {
                          try {
                              window.top.location.href = targetUrl;
                          } catch (err) {
                              window.open(targetUrl, '_blank', 'noopener,noreferrer');
                          }
                      } else {
                          window.location.href = targetUrl;
                      }
                  }
              }, true);

              function showToast(msg) {
                  var old = document.getElementById('tm-toast-banner');
                  if (old) old.remove();
                  var t = document.createElement('div');
                  t.id = 'tm-toast-banner';
                  t.className = 'tm-toast-banner';
                  t.textContent = msg;
                  document.body.appendChild(t);
                  setTimeout(function () {
                      if (t.parentNode) t.remove();
                  }, 5000);
              }

              // Helper: Generate a 6-character Alphanumeric Passcode
              function generateSixCharCode() {
                  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
                  var code = 'TM';
                  for (var i = 0; i < 4; i++) {
                      code += chars.charAt(Math.floor(Math.random() * chars.length));
                  }
                  return code;
              }

              function getStudentDirectory() {
                  try {
