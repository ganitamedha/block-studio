name: Build and Deploy Custom Scratch Studio

on:
  push:
    branches:
      - develop
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clean Install Exact Locked Dependencies
        run: npm ci --ignore-scripts

      - name: Apply Storage Fix & Self-Heal CSS Variables
        run: |
          # 1. Prepend original Scratch base variables so PostCSS never fails on an undefined $variable
          curl -sL https://raw.githubusercontent.com/scratchfoundation/scratch-gui/develop/src/css/colors.css > /tmp/base_colors.css
          cat src/css/colors.css > /tmp/custom_colors.css
          cat /tmp/base_colors.css /tmp/custom_colors.css > src/css/colors.css

          # 2. Keep src/playground/index.css minimal for Webpack CSS-Modules
          printf "html,\nbody {\n    height: 100%%;\n    margin: 0;\n    background-color: #F0FDFA;\n}\n" > src/playground/index.css

          # 3. Unpack scratch-storage@2.3.1 directly without modifying package-lock tree
          npm pack scratch-storage@2.3.1
          mkdir -p /tmp/ss231
          tar -xzf scratch-storage-2.3.1.tgz -C /tmp/ss231
          rm -rf node_modules/scratch-storage/*
          cp -r /tmp/ss231/package/* node_modules/scratch-storage/

          # 4. Ensure src/lib/storage.js uses the default import for scratch-storage@2.3.1
          cat << 'EOF' > src/lib/storage.js
          import ScratchStorage from 'scratch-storage';
          import defaultProject from './default-project';
          const PROJECT_SERVER = 'https://projects.scratch.mit.edu';
          const ASSET_SERVER = 'https://assets.scratch.mit.edu';
          class Storage extends ScratchStorage {
              constructor () {
                  super();
                  this.cacheDefaultProject();
              }
              addOfficialScratchWebStores () {
                  this.addWebStore(
                      [this.AssetType.Project],
                      projectAsset => {
                          const [projectId, revision] = projectAsset.assetId.split('.');
                          return revision ?
                              `${PROJECT_SERVER}/${projectId}?rev=${revision}` :
                              `${PROJECT_SERVER}/${projectId}`;
                      },
                       () => null,
                      () => null
                  );
                  this.addWebStore(
                      [this.AssetType.ImageVector, this.AssetType.ImageBitmap, this.AssetType.Sound],
                      asset => `${ASSET_SERVER}/internalapi/asset/${asset.assetId}.${asset.dataFormat}/get/`
                  );
                  this.addWebStore(
                      [this.AssetType.Sound],
                      asset => `static/extension-assets/scratch3_music/${asset.assetId}.${asset.dataFormat}`
                  );
              }
              setProjectHost (projectHost) {
                  this.projectHost = projectHost;
              }
              setProjectToken (projectToken) {
                  this.projectToken = projectToken;
              }
              getProjectGetConfig (projectAsset) {
                  const path = `${this.projectHost}/${projectAsset.assetId}`;
                  const qs = this.projectToken ? `?token=${this.projectToken}` : '';
                  return path + qs;
              }
              setAssetHost (assetHost) {
                  this.assetHost = assetHost;
              }
              getAssetGetConfig (asset) {
                  return `${this.assetHost}/internalapi/asset/${asset.assetId}.${asset.dataFormat}/get/`;
              }
              setTranslatorFunction (translator) {
                  this.translator = translator;
                  this.cacheDefaultProject();
              }
              cacheDefaultProject () {
                  const defaultProjectAssets = defaultProject(this.translator);
                  defaultProjectAssets.forEach(asset => this.builtinHelper._store(
                      this.AssetType[asset.assetType],
                      this.DataFormat[asset.dataFormat],
                      asset.data,
                      asset.id
                  ));
              }
          }
          const storage = new Storage();
          export default storage;
          EOF

      - name: Run Scratch Prepublish & Ensure Generated Assets Exist
        run: |
          node ./scripts/prepublish.mjs || true
          mkdir -p src/generated
          for file in $(grep -rhoE "generated/[a-zA-Z0-9._-]+(\.cjs|\.js)" src/ || true); do
            target="src/$file"
            if [ ! -f "$target" ]; then
              printf "module.exports = '';\n" > "$target"
            fi
          done

      - name: Build Custom Scratch GUI
        run: npx webpack --stats-error-details
        env:
          NODE_ENV: production
          CI: false
          NODE_OPTIONS: --max_old_space_size=6144

      - name: Inject Complete Landing Page UI/UX Theme into Built Studio
        run: |
          cat << 'EOF' > ./build/custom-theme.css
          @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Poppins:wght@500;600;700&display=swap');

          :root {
              --tm-header-start: #0D9488;
              --tm-header-end: #0284C7;
              --tm-workspace-bg: #F0FDFA;
              --tm-panel-bg: #E6FFFA;
              --tm-canvas-bg: #F8FAFC;
              --tm-border-color: #99F6E4;
              --tm-primary-accent: #0284C7;
              --tm-action-btn: #F97316;
              --tm-action-btn-hover: #EA580C;
              --tm-text-dark: #1E293B;
          }

          html, body {
              background-color: var(--tm-workspace-bg) !important;
              color: var(--tm-text-dark) !important;
              font-family: 'Poppins', 'Nunito', sans-serif !important;
          }

          button, input, select, textarea,
          [class*="menu-bar_"], [class*="gui_tab_"],
          [class*="sprite-info_"], [class*="sprite-selector_"],
          [class*="stage-selector_"] {
              font-family: 'Poppins', 'Nunito', sans-serif !important;
          }

          /* Top Header Menu Bar Gradient */
          [class*="menu-bar_menu-bar_"] {
              background: linear-gradient(90deg, var(--tm-header-start) 0%, var(--tm-header-end) 100%) !important;
              border-bottom: 2px solid #0F766E !important;
              box-shadow: 0 2px 10px rgba(13, 148, 136, 0.18) !important;
              color: #FFFFFF !important;
          }

          /* Main Workspace & Code / Costumes / Sounds Tabs */
          [class*="gui_body-wrapper_"] {
              background-color: var(--tm-workspace-bg) !important;
          }

          [class*="gui_tab_"] {
              background-color: #CCFBF1 !important;
              border: 1px solid var(--tm-border-color) !important;
              color: var(--tm-text-dark) !important;
              font-weight: 600 !important;
          }

          [class*="gui_tab_"][class*="gui_is-selected_"] {
              background-color: var(--tm-primary-accent) !important;
              border-color: var(--tm-primary-accent) !important;
              color: #FFFFFF !important;
          }

          [class*="gui_tab_"][class*="gui_is-selected_"] img {
              filter: brightness(0) invert(1);
          }

          /* Left Block Category Sidebar & Extension Button */
          .scratchCategoryMenu {
              background-color: #FFFFFF !important;
              border-right: 1px solid var(--tm-border-color) !important;
              color: var(--tm-text-dark) !important;
          }

          [class*="gui_extension-button-container_"] {
              background: linear-gradient(135deg, #0D9488 0%, #0284C7 100%) !important;
              border-color: #0F766E !important;
          }

          /* Stage Frame & Sprite Panels */
          [class*="stage-header_stage-header-wrapper_"] {
              background-color: var(--tm-workspace-bg) !important;
          }

          [class*="stage_stage-wrapper_"] [class*="stage_stage_"] {
              border: 2px solid var(--tm-border-color) !important;
              border-radius: 12px !important;
          }

          [class*="sprite-info_sprite-info_"] {
              background-color: #FFFFFF !important;
              border-bottom: 1px solid var(--tm-border-color) !important;
              border-top-left-radius: 10px !important;
              border-top-right-radius: 10px !important;
              color: var(--tm-text-dark) !important;
          }

          [class*="sprite-selector_sprite-selector_"] {
              background-color: var(--tm-panel-bg) !important;
              border: 1.5px solid var(--tm-border-color) !important;
              border-radius: 10px !important;
          }

          [class*="stage-selector_stage-selector_"] {
              background-color: #FFFFFF !important;
              border: 1.5px solid var(--tm-border-color) !important;
              border-radius: 10px !important;
          }

          [class*="sprite-selector-item_is-selected_"] {
              border: 2.5px solid var(--tm-primary-accent) !important;
          }

          [class*="sprite-selector-item_sprite-info_"] {
              background-color: var(--tm-primary-accent) !important;
              color: #FFFFFF !important;
          }

          /* Coral Floating Action Buttons (Choose Sprite / Choose Backdrop) */
          [class*="action-menu_main-button_"] {
              background-color: var(--tm-action-btn) !important;
              box-shadow: 0 4px 12px rgba(249, 115, 22, 0.35) !important;
          }

          [class*="action-menu_main-button_"]:hover {
              background-color: var(--tm-action-btn-hover) !important;
          }

          [class*="action-menu_more-buttons-outer_"] {
              background-color: var(--tm-header-start) !important;
          }

          /* Library Modals */
          [class*="modal_header_"] {
              background: linear-gradient(90deg, var(--tm-header-start) 0%, var(--tm-header-end) 100%) !important;
          }

          /* Permanently Hide the Disabled Bottom Backpack Bar */
          [class*="backpack_backpack-container_"] {
              display: none !important;
          }
          EOF
          sed -i 's|</head>|<link rel="stylesheet" href="custom-theme.css"></head>|g' ./build/index.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Built Studio for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
