              function downloadBlob(blob, filename) {
                  var url = URL.createObjectURL(blob);
                  var a = document.createElement('a');
                  a.href = url;
                  a.download = filename;
                  document.body.appendChild(a);
                  a.click();
                  setTimeout(function () {
                      document.body.removeChild(a);
                      URL.revokeObjectURL(url);
                  }, 500);
              }

              function blobToBase64(blob) {
                  return new Promise(function (resolve, reject) {
                      var reader = new FileReader();
                      reader.onloadend = function () {
                          var dataUrl = reader.result || '';
                          var commaIdx = dataUrl.indexOf(',');
                          resolve(commaIdx !== -1 ? dataUrl.slice(commaIdx + 1) : dataUrl);
                      };
                      reader.onerror = reject;
                      reader.readAsDataURL(blob);
                  });
              }

              function base64ToUint8Array(b64) {
                  var binStr = atob(b64.replace(/\s+/g, ''));
                  var len = binStr.length;
                  var bytes = new Uint8Array(len);
                  for (var i = 0; i < len; i++) {
                      bytes[i] = binStr.charCodeAt(i);
                  }
                  return bytes;
              }

              // IndexedDB + localStorage Dual Helper for Student Vault & Short-Link Cache
              function openProjectDB(callback) {
                  var req = indexedDB.open('TechMedhaStudioVault', 3);
                  req.onupgradeneeded = function (e) {
                      var db = e.target.result;
                      if (!db.objectStoreNames.contains('projects')) {
                          db.createObjectStore('projects', { keyPath: 'id' });
                      }
                      if (!db.objectStoreNames.contains('shares')) {
                          db.createObjectStore('shares', { keyPath: 'code' });
                      }
                  };
                  req.onsuccess = function (e) {
                      callback(e.target.result);
                  };
              }

              function saveLocalShareBackup(code, payloadStr) {
                  try {
                      localStorage.setItem('tm_share_' + code, payloadStr);
                  } catch (e) {}
                  try {
                      openProjectDB(function (db) {
                          if (!db.objectStoreNames.contains('shares')) return;
                          var tx = db.transaction('shares', 'readwrite');
                          tx.objectStore('shares').put({ code: code, payload: payloadStr });
                      });
                  } catch (e2) {}
              }

              function getLocalShareBackup(code) {
                  return new Promise(function (resolve) {
                      try {
                          var ls = localStorage.getItem('tm_share_' + code);
                          if (ls) {
                              resolve(ls);
                              return;
                          }
                      } catch (e) {}
                      try {
                          openProjectDB(function (db) {
                              if (!db.objectStoreNames.contains('shares')) {
                                  resolve(null);
                                  return;
                              }
                              var tx = db.transaction('shares', 'readonly');
                              var req = tx.objectStore('shares').get(code);
                              req.onsuccess = function () {
                                  resolve(req.result ? req.result.payload : null);
                              };
                              req.onerror = function () { resolve(null); };
                          });
                      } catch (e2) {
                          resolve(null);
                      }
                  });
              }

              // 5. Short Shareable Link Generator (Strictly Short ?s=KEY - Never Generates a Paragraph)
              async function createShareableProjectLink(projTitle, studentName, schoolInfo) {
                  var baseUrl = window.location.origin + window.location.pathname;
                  var vm = getScratchVM();
                  if (!vm) return baseUrl;

                  var sb3B64 = '';
                  var jsonStr = '';
                  try {
                      if (typeof vm.saveProjectSb3 === 'function') {
                          var sb3Blob = await vm.saveProjectSb3();
                          sb3B64 = await blobToBase64(sb3Blob);
                      }
                  } catch (errSb3) {}
                  try {
                      if (typeof vm.toJSON === 'function') {
                          jsonStr = vm.toJSON();
                      }
                  } catch (errJson) {}

                  var payloadStr = JSON.stringify({
                      v: 3,
                      t: projTitle || 'TechMedha Project',
                      by: studentName || 'M.V.S.S. Mokshagna',
                      sc: schoolInfo || 'Techmedha High School, Dilsukhnagar, Hyderabad, TS',
                      sb3: sb3B64,
                      json: jsonStr
                  });

                  // Provider 1: Bytebin (CORS Simple Request using text/plain)
                  try {
                      var r1 = await fetch('https://bytebin.lucko.me/post', {
                          method: 'POST',
                          headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
                          body: payloadStr
                      });
                      if (r1.ok) {
                          var d1 = await r1.json();
                          if (d1 && d1.key) {
                              var code1 = 'b_' + d1.key;
                              saveLocalShareBackup(code1, payloadStr);
                              return baseUrl + '?s=' + encodeURIComponent(code1);
                          }
                      }
                  } catch (e1) {}

                  // Provider 2: pastes.dev API (CORS Simple Request using text/plain)
                  try {
                      var r2 = await fetch('https://api.pastes.dev/post', {
                          method: 'POST',
                          headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
                          body: payloadStr
                      });
                      if (r2.ok) {
                          var d2 = await r2.json();
                          if (d2 && d2.key) {
                              var code2 = 'p_' + d2.key;
                              saveLocalShareBackup(code2, payloadStr);
                              return baseUrl + '?s=' + encodeURIComponent(code2);
                          }
                      }
                  } catch (e2) {}

                  // Provider 3: JSONBlob API
                  try {
                      var r3 = await fetch('https://jsonblob.com/api/jsonBlob', {
                          method: 'POST',
                          headers: {
                              'Content-Type': 'application/json',
                              'Accept': 'application/json'
                          },
                          body: payloadStr
                      });
                      if (r3.ok || r3.status === 201) {
                          var loc = r3.headers.get('Location') || r3.headers.get('location') || r3.headers.get('X-jsonblob') || '';
                          var parts = loc.split('/');
                          var jbId = parts[parts.length - 1];
                          if (jbId) {
                              var code3 = 'j_' + jbId;
                              saveLocalShareBackup(code3, payloadStr);
                              return baseUrl + '?s=' + encodeURIComponent(code3);
                          }
                      }
                  } catch (e3) {}

                  // Guaranteed Short Local Vault Key (Never outputs a long paragraph URL)
                  var localCode = 'L_' + generateSixCharCode();
                  saveLocalShareBackup(localCode, payloadStr);
                  return baseUrl + '?s=' + encodeURIComponent(localCode);
              }

              async function fetchSharedPayload(shortCode) {
                  var localData = await getLocalShareBackup(shortCode);
                  if (localData) {
                      return JSON.parse(localData);
                  }

                  var prefix = shortCode.slice(0, 2);
                  var rawKey = shortCode.slice(2);
                  var url = '';

                  if (prefix === 'b_') {
                      url = 'https://bytebin.lucko.me/' + encodeURIComponent(rawKey);
                  } else if (prefix === 'p_') {
                      url = 'https://api.pastes.dev/' + encodeURIComponent(rawKey);
                  } else if (prefix === 'j_') {
                      url = 'https://jsonblob.com/api/jsonBlob/' + encodeURIComponent(rawKey);
                  } else {
                      url = 'https://bytebin.lucko.me/' + encodeURIComponent(shortCode);
                  }

                  var resp = await fetch(url);
                  if (!resp.ok) throw new Error('HTTP ' + resp.status);
                  var text = await resp.text();
                  return JSON.parse(text);
              }

              function activateLoadedProjectWorkspace(vm, titleText) {
                  try {
                      if (titleText) {
                          setProjectTitleInput(titleText);
                      }
                      if (vm && vm.runtime && Array.isArray(vm.runtime.targets)) {
                          var spriteTarget = null;
                          for (var i = 0; i < vm.runtime.targets.length; i++) {
                              if (!vm.runtime.targets[i].isStage) {
                                  spriteTarget = vm.runtime.targets[i];
                                  break;
                              }
                          }
                          if (spriteTarget && typeof vm.setEditingTarget === 'function') {
                              vm.setEditingTarget(spriteTarget.id);
                          }
                          if (typeof vm.emitTargetsUpdate === 'function') {
                              vm.emitTargetsUpdate();
                          }
                          if (typeof vm.emitWorkspaceUpdate === 'function') {
                              vm.emitWorkspaceUpdate();
                          }
                          if (typeof vm.runtime.requestRedraw === 'function') {
                              vm.runtime.requestRedraw();
                          }
                          if (vm.renderer && typeof vm.renderer.draw === 'function') {
                              vm.renderer.draw();
                          }
                      }
                  } catch (e) {}
              }

              // 6. Reliable Shared Project Resumer in New Browser Tab & QR Scan
              var sharedLoadState = 'idle';
              var cachedSharedMeta = null;

              async function checkAndLoadSharedProjectFromUrl() {
                  if (sharedLoadState !== 'idle') return;

                  var params = new URLSearchParams(window.location.search);
                  var shortCode = params.get('s') || params.get('p');
                  if (!shortCode) {
                      sharedLoadState = 'done';
                      return;
                  }

                  var loaderOverlay = document.querySelector('[class*="loader_background"]');
                  var blocklySvg = document.querySelector('.blocklySvg');
                  var stageCanvas = document.querySelector('[class*="stage_stage"] canvas');
                  var vm = getScratchVM();

                  if (loaderOverlay || !blocklySvg || !stageCanvas || !vm || !vm.runtime || !vm.runtime.targets || vm.runtime.targets.length === 0) {
                      return;
                  }

                  sharedLoadState = 'loading';
                  showToast('⏳ Loading shared project "' + shortCode + '"...', 8000);

                  try {
                      var payload = await fetchSharedPayload(shortCode);
                      if (payload) {
                          cachedSharedMeta = payload;
                          await new Promise(function (r) { setTimeout(r, 500); });

                          var loadedOk = false;
                          if (payload.sb3) {
                              try {
                                  var u8 = base64ToUint8Array(payload.sb3);
                                  await vm.loadProject(u8.buffer);
                                  loadedOk = true;
                              } catch (sb3Err) {}
                          }
                          if (!loadedOk && payload.json) {
                              await vm.loadProject(payload.json);
                              loadedOk = true;
                          }

                          if (loadedOk) {
                              activateLoadedProjectWorkspace(vm, payload.t || 'TechMedha Project');
                              setTimeout(function () {
                                  activateLoadedProjectWorkspace(vm, payload.t || 'TechMedha Project');
                              }, 900);
                              setTimeout(function () {
                                  activateLoadedProjectWorkspace(vm, payload.t || 'TechMedha Project');
                              }, 2000);

                              var creatorText = payload.by ? (' by ' + payload.by) : '';
                              var schoolText = payload.sc ? (' (' + payload.sc + ')') : '';
                              showToast('✨ Resumed "' + (payload.t || 'TechMedha Project') + '"' + creatorText + schoolText + '!', 6500);
                          }
                      }
                      sharedLoadState = 'done';
                  } catch (err) {
                      sharedLoadState = 'done';
                      showToast('⚠️ Could not load shared project (' + err.message + ').', 6000);
                  }
              }

              function renderQrToCanvas(canvasEl, urlText, sizePx, onDone) {
                  if (!canvasEl) {
                      if (onDone) onDone();
                      return;
                  }
                  if (window.QRious) {
                      new window.QRious({
                          element: canvasEl,
                          value: urlText,
                          size: sizePx || 180,
                          level: 'M',
                          background: '#FFFFFF',
                          foreground: '#0F172A',
                          padding: 8
                      });
                      if (onDone) onDone();
                  } else {
                      var img = new Image();
                      img.crossOrigin = 'anonymous';
                      img.onload = function () {
                          canvasEl.width = sizePx || 180;
                          canvasEl.height = sizePx || 180;
                          var ctx = canvasEl.getContext('2d');
                          ctx.fillStyle = '#FFFFFF';
                          ctx.fillRect(0, 0, canvasEl.width, canvasEl.height);
                          ctx.drawImage(img, 0, 0, canvasEl.width, canvasEl.height);
                          if (onDone) onDone();
                      };
                      img.onerror = function () { if (onDone) onDone(); };
                      img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=' + (sizePx || 180) + 'x' + (sizePx || 180) + '&data=' + encodeURIComponent(urlText);
                  }
              }

              function downloadStudentIdCard(student) {
                  var c = document.createElement('canvas');
                  c.width = 540;
                  c.height = 300;
                  var ctx = c.getContext('2d');

                  ctx.fillStyle = '#F0FDFA';
                  ctx.fillRect(0, 0, 540, 300);
                  ctx.strokeStyle = '#0D9488';
                  ctx.lineWidth = 6;
                  ctx.strokeRect(3, 3, 534, 294);

                  var grad = ctx.createLinearGradient(0, 0, 540, 0);
                  grad.addColorStop(0, '#0D9488');
                  grad.addColorStop(1, '#0284C7');
                  ctx.fillStyle = grad;
                  ctx.fillRect(0, 0, 540, 68);

                  ctx.fillStyle = '#FFFFFF';
                  ctx.font = 'bold 20px sans-serif';
                  ctx.fillText('🎓 TECHMEDHA LIFETIME STUDENT ID', 22, 34);
                  ctx.font = '600 13px sans-serif';
                  ctx.fillText('www.techmedha.in • Keep this 6-character code safe!', 22, 54);

                  ctx.fillStyle = '#0F766E';
                  ctx.font = 'bold 13px sans-serif';
                  ctx.fillText('STUDENT NAME:', 26, 108);
                  ctx.fillText('SCHOOL NAME:', 26, 152);
                  ctx.fillText('AREA / STATE:', 26, 196);
                  ctx.fillText('6-CHAR VAULT PASSCODE:', 26, 250);

                  ctx.fillStyle = '#1E293B';
                  ctx.font = 'bold 17px sans-serif';
                  ctx.fillText(student.name || 'M.V.S.S. Mokshagna', 160, 108);
                  ctx.font = '600 15px sans-serif';
                  ctx.fillText(student.school || 'Techmedha High School', 160, 152);
                  ctx.fillText(student.area || 'Dilsukhnagar, Hyderabad, TS', 160, 196);

                  ctx.fillStyle = '#0284C7';
                  ctx.fillRect(225, 224, 150, 38);
                  ctx.fillStyle = '#FFFFFF';
                  ctx.font = 'bold 21px monospace';
                  ctx.fillText(student.passcode, 252, 250);

                  c.toBlob(function (blob) {
                      if (blob) downloadBlob(blob, (student.name || 'Student').replace(/\s+/g, '-') + '-TechMedha-ID.png');
                  }, 'image/png');
              }

              function saveProjectToStudentVault(student, title, sb3Blob, onDone) {
                  openProjectDB(function (db) {
                      var tx = db.transaction('projects', 'readwrite');
                      var store = tx.objectStore('projects');
                      var item = {
                          id: student.key + '__' + Date.now(),
                          studentKey: student.key,
                          passcode: student.passcode,
                          title: title,
                          updatedAt: new Date().toLocaleString(),
                          blob: sb3Blob
                      };
                      store.put(item);
                      tx.oncomplete = function () {
                          if (onDone) onDone();
                      };
                  });
              }

              function getStudentProjects(student, onResult) {
                  openProjectDB(function (db) {
                      var tx = db.transaction('projects', 'readonly');
                      var store = tx.objectStore('projects');
                      var req = store.getAll();
                      req.onsuccess = function () {
                          var all = req.result || [];
                          var filtered = all.filter(function (p) {
                              return p.studentKey === student.key || (student.passcode && p.passcode === student.passcode);
                          });
                          filtered.sort(function (a, b) { return b.id.localeCompare(a.id); });
                          onResult(filtered);
                      };
                  });
              }

              function deleteStudentProject(projectId, onDone) {
                  openProjectDB(function (db) {
                      var tx = db.transaction('projects', 'readwrite');
                      tx.objectStore('projects').delete(projectId);
                      tx.oncomplete = function () {
                          if (onDone) onDone();
                      };
                  });
              }

