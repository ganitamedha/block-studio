              function downloadBlob(blob, filename) {
                  var url = URL.createObjectURL(blob);
                  var a = document.createElement('a');
                  a.href = url;
                  a.download = filename;
                  document.body.appendChild(a);
                  a.click();
                  setTimeout(function () {
                      document.body.removeChild(a);
                      URL.revokeObjectURL(url);
                  }, 500);
              }

              // Compress & Decompress JSON for Fallback URL Sharing
              async function compressToBase64Url(str) {
                  if (typeof CompressionStream !== 'undefined') {
                      var bytes = new TextEncoder().encode(str);
                      var cs = new CompressionStream('deflate-raw');
                      var writer = cs.writable.getWriter();
                      writer.write(bytes);
                      writer.close();
                      var buf = await new Response(cs.readable).arrayBuffer();
                      var bin = '';
                      var u8 = new Uint8Array(buf);
                      for (var i = 0; i < u8.length; i++) bin += String.fromCharCode(u8[i]);
                      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
                  }
                  return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
              }

              async function decompressFromBase64Url(b64url) {
                  var b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
                  while (b64.length % 4) b64 += '=';
                  var bin = atob(b64);
                  var u8 = new Uint8Array(bin.length);
                  for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
                  if (typeof DecompressionStream !== 'undefined') {
                      var ds = new DecompressionStream('deflate-raw');
                      var writer = ds.writable.getWriter();
                      writer.write(u8);
                      writer.close();
                      var buf = await new Response(ds.readable).arrayBuffer();
                      return new TextDecoder().decode(buf);
                  }
                  return decodeURIComponent(escape(bin));
              }

              // Generate Short Cloud Shareable Link for Current Project (with fallback)
              async function createShareableProjectLink(projTitle, studentName, schoolInfo) {
                  var baseUrl = window.location.origin + window.location.pathname;
                  var qParams = 't=' + encodeURIComponent(projTitle) +
                      (studentName ? '&by=' + encodeURIComponent(studentName) : '') +
                      (schoolInfo ? '&sc=' + encodeURIComponent(schoolInfo) : '');

                  if (window.vm && typeof window.vm.saveProjectSb3 === 'function') {
                      try {
                          var sb3Blob = await window.vm.saveProjectSb3();
                          var resp = await fetch('https://bytebin.lucko.me/post', {
                              method: 'POST',
                              headers: { 'Content-Type': 'application/octet-stream' },
                              body: sb3Blob
                          });
                          if (resp.ok) {
                              var data = await resp.json();
                              if (data && data.key) {
                                  return baseUrl + '?s=' + encodeURIComponent(data.key) + '&' + qParams;
                              }
                          }
                      } catch (err) {
                          console.warn('Cloud shortener fallback:', err);
                      }

                      // Fallback: Compress VM JSON into URL Hash
                      try {
                          var jsonStr = window.vm.toJSON();
                          var compressed = await compressToBase64Url(jsonStr);
                          return baseUrl + '?' + qParams + '#z=' + compressed;
                      } catch (e2) {}
                  }
                  return baseUrl;
              }

              // Render QR Code onto a target <canvas>
              function renderQrToCanvas(canvasEl, urlText, sizePx) {
                  if (!canvasEl) return;
                  if (window.QRious) {
                      new window.QRious({
                          element: canvasEl,
                          value: urlText,
                          size: sizePx || 180,
                          level: 'M',
                          background: '#FFFFFF',
                          foreground: '#0F172A',
                          padding: 8
                      });
                  } else {
                      var img = new Image();
                      img.crossOrigin = 'anonymous';
                      img.onload = function () {
                          canvasEl.width = sizePx || 180;
                          canvasEl.height = sizePx || 180;
                          var ctx = canvasEl.getContext('2d');
                          ctx.fillStyle = '#FFFFFF';
                          ctx.fillRect(0, 0, canvasEl.width, canvasEl.height);
                          ctx.drawImage(img, 0, 0, canvasEl.width, canvasEl.height);
                      };
                      img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=' + (sizePx || 180) + 'x' + (sizePx || 180) + '&data=' + encodeURIComponent(urlText);
                  }
              }

              // Auto-Load Shared Project When Opening a QR Code Link (?s=... or #z=...)
              var sharedProjectChecked = false;
              async function checkAndLoadSharedProjectFromUrl() {
                  if (sharedProjectChecked) return;
                  var params = new URLSearchParams(window.location.search);
                  var shareKey = params.get('s');
                  var hashStr = window.location.hash || '';
                  var hasHashProj = hashStr.indexOf('#z=') === 0;

                  if (!shareKey && !hasHashProj) {
                      sharedProjectChecked = true;
                      return;
                  }
                  if (!window.vm || !window.vm.runtime || !window.vm.runtime.targets || !window.vm.runtime.targets.length) {
                      return;
                  }
                  sharedProjectChecked = true;

                  var sharedTitle = params.get('t') || 'Shared TechMedha Project';
                  var sharedBy = params.get('by') || '';
                  var sharedSchool = params.get('sc') || '';

                  try {
                      showToast('⏳ Loading shared project "' + sharedTitle + '"...');
                      if (shareKey) {
                          var resp = await fetch('https://bytebin.lucko.me/' + encodeURIComponent(shareKey));
                          if (resp.ok) {
                              var buf = await resp.arrayBuffer();
                              await window.vm.loadProject(buf);
                              setProjectTitleInput(sharedTitle);
                              showToast('✨ Loaded "' + sharedTitle + '"' + (sharedBy ? ' by ' + sharedBy : '') + (sharedSchool ? ' (' + sharedSchool + ')' : '') + '!');
                              return;
                          }
                      }
                      if (hasHashProj) {
                          var rawJson = await decompressFromBase64Url(hashStr.slice(3));
                          await window.vm.loadProject(rawJson);
                          setProjectTitleInput(sharedTitle);
                          showToast('✨ Loaded "' + sharedTitle + '"' + (sharedBy ? ' by ' + sharedBy : '') + '!');
                      }
                  } catch (err) {
                      console.error('Failed to load shared project:', err);
                      showToast('⚠️ Could not load shared project link.');
                  }
              }

              // Helper: Download Student ID Card (.PNG) with 6-Char Passcode
              function downloadStudentIdCard(student) {
                  var c = document.createElement('canvas');
                  c.width = 520;
                  c.height = 300;
                  var ctx = c.getContext('2d');

                  ctx.fillStyle = '#F0FDFA';
                  ctx.fillRect(0, 0, 520, 300);
                  ctx.strokeStyle = '#0D9488';
                  ctx.lineWidth = 6;
                  ctx.strokeRect(3, 3, 514, 294);

                  var grad = ctx.createLinearGradient(0, 0, 520, 0);
                  grad.addColorStop(0, '#0D9488');
                  grad.addColorStop(1, '#0284C7');
                  ctx.fillStyle = grad;
                  ctx.fillRect(0, 0, 520, 68);

                  ctx.fillStyle = '#FFFFFF';
                  ctx.font = 'bold 20px sans-serif';
                  ctx.fillText('🎓 TECHMEDHA LIFETIME STUDENT ID', 22, 34);
                  ctx.font = '600 13px sans-serif';
                  ctx.fillText('www.techmedha.in • Keep this 6-character code safe!', 22, 54);

                  ctx.fillStyle = '#0F766E';
                  ctx.font = 'bold 13px sans-serif';
                  ctx.fillText('STUDENT NAME:', 26, 108);
                  ctx.fillText('SCHOOL NAME:', 26, 152);
                  ctx.fillText('AREA / STATE:', 26, 196);
                  ctx.fillText('6-CHAR VAULT PASSCODE:', 26, 250);

                  ctx.fillStyle = '#1E293B';
