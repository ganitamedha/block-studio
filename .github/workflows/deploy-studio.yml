              }

              function updateLoginButtonUI() {
                  var loginBtn = document.getElementById('tm-custom-login-btn');
                  if (!loginBtn) return;
                  var student = getCurrentStudent();
                  if (student) {
                      loginBtn.className = 'tm-login-header-btn logged-in';
                      loginBtn.innerHTML = '<span>🎓 ' + student.name + ' [' + (student.passcode || '') + '] ▾</span>';
                  } else {
                      loginBtn.className = 'tm-login-header-btn';
                      loginBtn.innerHTML = '<span>👤 Student Login</span>';
                  }
              }

              // 9. Self-Healing Top Header Mount (Share + Student Login Only - Debug Button Removed)
              function ensureStudioEnhancements() {
                  if (!document.body) return;

                  var titleInput = findTitleInput();
                  if (titleInput && (titleInput.value === 'Scratch Project' || !titleInput.value) && !cachedSharedMeta) {
                      setProjectTitleInput('TechMedha Project');
                  }

                  getScratchVM();
                  checkAndLoadSharedProjectFromUrl();

                  var controlsWrap = document.getElementById('tm-header-controls');
                  if (!controlsWrap) {
                      controlsWrap = document.createElement('div');
                      controlsWrap.id = 'tm-header-controls';

                      var shareBtn = document.createElement('button');
                      shareBtn.id = 'tm-custom-share-btn';
                      shareBtn.className = 'tm-share-header-btn';
                      shareBtn.type = 'button';
                      shareBtn.innerHTML = '<span>🚀 Share</span>';
                      shareBtn.onclick = openShareModal;

                      var loginBtn = document.createElement('button');
                      loginBtn.id = 'tm-custom-login-btn';
                      loginBtn.className = 'tm-login-header-btn';
                      loginBtn.type = 'button';
                      loginBtn.onclick = openLoginModal;

                      controlsWrap.appendChild(shareBtn);
                      controlsWrap.appendChild(loginBtn);
                      document.body.appendChild(controlsWrap);

                      updateLoginButtonUI();
                  }
              }

              setInterval(ensureStudioEnhancements, 500);
              window.addEventListener('DOMContentLoaded', ensureStudioEnhancements);
              window.addEventListener('load', ensureStudioEnhancements);
          })();
          EOF

          # Inject into src/playground/index.ejs using split/join
          cat << 'EOF' > /tmp/patch-ejs.cjs
          const fs = require('fs');
          const ejsPath = 'src/playground/index.ejs';
          if (fs.existsSync(ejsPath)) {
              let ejs = fs.readFileSync(ejsPath, 'utf8');
              const stamp = Date.now();
              const tag = '<link rel="stylesheet" href="tm-studio-bundle.css?v=' + stamp + '"><script src="tm-studio-bundle.js?v=' + stamp + '"></script></head>';
              ejs = ejs.split('</head>').join(tag);
              fs.writeFileSync(ejsPath, ejs, 'utf8');
              console.log('Safely injected bundle tags into src/playground/index.ejs');
          }
          EOF
          node /tmp/patch-ejs.cjs

      - name: Run Scratch Prepublish & Ensure Generated Assets Exist
        run: |
          node ./scripts/prepublish.mjs || true
          mkdir -p src/generated
          for file in $(grep -rhoE "generated/[a-zA-Z0-9._-]+(\.cjs|\.js)" src/ || true); do
            target="src/$file"
            if [ ! -f "$target" ]; then
              printf "module.exports = '';\n" > "$target"
            fi
          done

      - name: Build Custom Scratch GUI & Copy Storage Worker Chunks
        run: |
          npx webpack --stats-error-details
          mkdir -p ./build/chunks ./build/static/chunks
          find node_modules -path "*/scratch-storage/*" -name "*fetch-worker*" -exec cp {} ./build/chunks/ \; || true
          find node_modules -path "*/scratch-storage/*" -name "*fetch-worker*" -exec cp {} ./build/static/chunks/ \; || true
          cp /tmp/tm-studio-bundle.css ./build/tm-studio-bundle.css
          cp /tmp/tm-studio-bundle.js ./build/tm-studio-bundle.js
        env:
          NODE_ENV: production
          CI: false
          NODE_OPTIONS: --max_old_space_size=6144

      - name: Safe Inline-Inject Bundle into Built HTML Files
        run: |
          cat << 'EOF' > /tmp/verify-build-html.cjs
          const fs = require('fs');
          const path = require('path');
          const css = fs.readFileSync('/tmp/tm-studio-bundle.css', 'utf8');
          const js = fs.readFileSync('/tmp/tm-studio-bundle.js', 'utf8');
          const inlineBlock = `<style id="tm-inline-css">${css}</style><script id="tm-inline-js">${js}</script>`;

          for (const file of fs.readdirSync('./build')) {
              if (file.endsWith('.html')) {
                  const full = path.join('./build', file);
                  let html = fs.readFileSync(full, 'utf8');
                  if (html.includes('</head>')) {
                      html = html.split('</head>').join(inlineBlock + '</head>');
                  } else {
                      html += inlineBlock;
                  }
                  fs.writeFileSync(full, html, 'utf8');
                  console.log('Safely inlined bundle into', full);
              }
          }
          EOF
          node /tmp/verify-build-html.cjs

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Built Studio for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
